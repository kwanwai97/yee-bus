<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全港巴士實時到站系統 • 完美版</title>
    <style>
        /* 全部樣式保持不變（略）—— 与原文件相同，此处省略以减少篇幅，实际使用时请保留完整样式 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background-color: #ffffff; border-radius: 20px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08); padding: 18px 16px 24px; }
        .header { text-align: center; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 2px solid #e9ecef; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #1a1a2e; letter-spacing: 0.5px; margin: 0; }
        .header .sub-info { display: flex; justify-content: space-between; font-size: 0.7rem; color: #6c757d; margin-top: 4px; flex-wrap: wrap; }
        .header .sub-info span { background: #f8f9fa; padding: 2px 8px; border-radius: 12px; }
        .search-panel { background: #f8f9fc; border-radius: 16px; padding: 14px 12px; margin-bottom: 16px; border: 1px solid #e9ecef; }
        .input-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: nowrap; align-items: stretch; }
        .input-row select, .input-row input { padding: 10px 8px; border: 1px solid #ced4da; border-radius: 10px; font-size: 0.95rem; background-color: #fff; transition: border-color 0.2s; }
        .input-row select:focus, .input-row input:focus { border-color: #4dabf7; outline: none; box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.25); }
        .input-row select { flex: 0 0 68px; width: 68px; min-width: 62px; max-width: 72px; font-weight: 600; padding-left: 6px; padding-right: 4px; }
        .input-row input { flex: 0 0 64px; min-width: 56px; max-width: 72px; text-transform: uppercase; text-align: center; }
        .input-row .dir-chip { flex: 1 1 0; min-width: 0; width: auto; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn-group .btn { flex: 1; padding: 10px 0; border: none; border-radius: 10px; font-weight: 600; font-size: 0.85rem; color: #fff; cursor: pointer; transition: opacity 0.15s, transform 0.1s; min-width: 80px; }
        .btn-group .btn:active { transform: scale(0.97); }
        .btn-outbound { background: #2b8a3e; }
        .btn-inbound { background: #1c7ed6; }
        .btn-outbound:hover { background: #237032; }
        .btn-inbound:hover { background: #1864ab; }
        .station-select-box { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ced4da; font-size: 0.9rem; background-color: #fff; margin-bottom: 10px; }
        .add-row { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
        .add-row .btn { flex: 1; padding: 10px 0; border: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; color: #fff; cursor: pointer; transition: opacity 0.2s; min-width: 100px; }
        .add-row .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-add { background: #495057; }
        .btn-add:not(:disabled):hover { background: #343a40; }
        .btn-quick { background: #2b8a3e; }
        .btn-quick:not(:disabled):hover { background: #237032; }
        .btn-quick:disabled { background: #adb5bd; }
        .btn-locate { background: #e67700; flex: 0.7 !important; min-width: 70px !important; }
        .btn-locate:not(:disabled):hover { background: #cc6a00; }
        .btn-locate:disabled { background: #adb5bd; }
        .btn-locate.locating { background: #1c7ed6; animation: pulse 1s infinite; }
        .dir-chip { padding: 0 4px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.82rem; color: #fff; cursor: pointer; transition: opacity 0.15s, transform 0.1s; white-space: nowrap; flex: 1 1 0; min-width: 0; text-align: center; line-height: 1.15; height: 41px; letter-spacing: 0; display: flex; align-items: center; justify-content: center; }
        .dir-chip:active { transform: scale(0.95); }
        .dir-chip.btn-outbound { background: #2b8a3e; }
        .dir-chip.btn-inbound { background: #1c7ed6; }
        .dir-chip.btn-outbound:hover { background: #237032; }
        .dir-chip.btn-inbound:hover { background: #1864ab; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .monitor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .monitor-header .title { font-weight: 700; font-size: 1.05rem; color: #212529; }
        .monitor-header .actions { display: flex; gap: 8px; }
        .monitor-header .actions button { background: none; border: 1px solid #dee2e6; border-radius: 20px; padding: 4px 12px; font-size: 0.7rem; color: #495057; cursor: pointer; transition: all 0.15s; }
        .monitor-header .actions button:hover { background: #e9ecef; }
        #busList { display: flex; flex-direction: column; gap: 5px; }
        .route-item { display: flex; align-items: center; padding: 6px 8px; background: #f8f9fa; border-radius: 8px; border-left: 3px solid #adb5bd; transition: background 0.1s; position: relative; gap: 36px; }
        .route-item .badge { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 16px; color: #fff; min-width: 38px; text-align: center; letter-spacing: 0.15px; flex-shrink: 0; align-self: center; }
        .badge-kmb { background: #d63333; }
        .badge-ctb { background: #f59f00; color: #212529; }
        .badge-nlb { background: #1c7ed6; }
        .route-name { font-size: 1.35rem; font-weight: 800; min-width: 34px; max-width: 56px; text-align: center; color: #1a1a2e; overflow: hidden; white-space: nowrap; line-height: 1; align-self: center; }
        .route-left { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; width: 40px; min-width: 36px; max-width: 56px; overflow: visible; }
        .route-left .badge { width: 100%; border-radius: 12px; padding: 1px 4px; font-size: 0.62rem; min-width: unset; }
        .route-left .route-name { font-size: 1.1rem; max-width: none; margin: 0; }
        .route-info { flex: 1; margin-left: 0; min-width: 0; }
        .route-dest { font-size: 0.92rem; font-weight: 600; color: #212529; display: flex; align-items: center; gap: 2px; flex-wrap: wrap; line-height: 1.1; }
        .station-name { font-size: 0.82rem; color: #495057; margin-top: 0px; word-break: break-word; line-height: 1.1; }
        .walk-info { font-size: 0.76rem; color: #6c757d; margin-top: 0px; line-height: 1.1; }
        .dir-badge { font-size: 0.7rem; padding: 1px 6px; border-radius: 16px; color: #fff; font-weight: 600; background: #6c757d; }
        .status-inline { font-size: 0.72rem; font-weight: 700; padding: 0px 6px; border-radius: 16px; color: #fff; line-height: 1.2; white-space: nowrap; flex-shrink: 0; }
        .status-ok { background: #2b8a3e; }
        .status-rush { background: #e67700; }
        .status-late { background: #c92a2a; }
        .route-right { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0; margin-left: 4px; min-width: 54px; }
        .eta-multi { text-align: right; font-weight: 700; font-size: 1.1rem; color: #d63333; min-width: 50px; line-height: 1.1; }
        .eta-multi .eta-min { display: block; }
        .eta-multi .eta-min.small { font-size: 0.82rem; color: #6c757d; font-weight: 400; }
        .eta-remark { font-size: 0.72rem; color: #868e96; margin-top: 0px; line-height: 1.1; }
        .del-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: #adb5bd; transition: color 0.15s; padding: 0 4px; line-height: 1; }
        .del-btn:hover { color: #c92a2a; }
        .empty-message { text-align: center; color: #adb5bd; padding: 28px 0; font-size: 0.9rem; }
        .loading-dots::after { content: '...'; animation: dots 1.2s steps(3, end) infinite; }
        @keyframes dots { 0% { content: ''; } 33% { content: '.'; } 66% { content: '..'; } 100% { content: '...'; } }
        @media (max-width: 400px) { .input-row { gap: 5px; } .input-row select { flex-basis: 58px; width: 58px; min-width: 54px; max-width: 62px; font-size: 0.75rem; } .input-row input { min-width: 50px; max-width: 62px; font-size: 0.8rem; } .input-row .route-field, .input-row .route-field input { flex: 0 0 56px; width: 56px; min-width: 50px; max-width: 62px; font-size: 0.8rem; } .search-tab { font-size: 0.8rem; padding: 7px 6px; } .input-row .dir-chip { font-size: 0.72rem; padding: 0 2px; border-radius: 8px; } .route-name { font-size: 1.05rem; } .route-left { width: 44px; } .route-dest { font-size: 0.72rem; } .station-name { font-size: 0.66rem; } .walk-info { font-size: 0.64rem; } .eta-multi { font-size: 0.85rem; min-width: 40px; } .btn-locate { flex: 0.6 !important; min-width: 56px !important; font-size: 0.7rem !important; padding: 8px 4px !important; } }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #212529; color: #fff; padding: 10px 20px; border-radius: 40px; font-size: 0.85rem; font-weight: 500; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); z-index: 999; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; max-width: 90%; }
        .toast.show { opacity: 1; }
        .quick-hint { font-size: 0.7rem; color: #6c757d; margin-top: 4px; text-align: right; min-height: 1.2rem; transition: color 0.3s; cursor: pointer; }
        .quick-hint.active { color: #2b8a3e; }
        .quick-hint.error { color: #c92a2a; }
        .quick-hint .hint-btn { color: #1c7ed6; font-weight: 600; cursor: pointer; text-decoration: underline; background: none; border: none; font-size: inherit; padding: 0 2px; }
        .quick-hint .hint-btn:hover { color: #1864ab; }
        .gps-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; transition: background 0.3s; }
        .gps-dot.ok { background: #2b8a3e; }
        .gps-dot.error { background: #c92a2a; }
        .gps-dot.pending { background: #f59f00; animation: pulse 1s infinite; }
        .nearby-panel { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #dee2e6; }
        .place-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .place-row input { flex: 1 1 140px; min-width: 0; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 10px; font-size: 0.9rem; background: #fff; text-transform: none; }
        .place-row input:focus { border-color: #4dabf7; outline: none; box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.25); }
        .place-row .btn { flex: 0 0 auto; padding: 10px 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.85rem; color: #fff; cursor: pointer; min-width: 96px; }
        .btn-nearby { background: #7048e8; }
        .btn-nearby:not(:disabled):hover { background: #5f3dc4; }
        .btn-nearby:disabled { background: #adb5bd; cursor: not-allowed; }
        .btn-place { background: #1c7ed6; }
        .btn-place:not(:disabled):hover { background: #1864ab; }
        .btn-place:disabled { background: #adb5bd; cursor: not-allowed; }
        .nearby-results { margin-top: 8px; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .nearby-stop { background: #fff; border: 1px solid #e9ecef; border-radius: 10px; padding: 8px 10px; }
        .nearby-stop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
        .nearby-stop-name { font-size: 0.84rem; font-weight: 600; color: #212529; line-height: 1.25; }
        .nearby-stop-dist { font-size: 0.75rem; font-weight: 700; color: #7048e8; white-space: nowrap; }
        .nearby-routes { display: flex; flex-wrap: wrap; gap: 6px; }
        .nearby-chip { border: none; border-radius: 16px; padding: 3px 8px; font-size: 0.72rem; font-weight: 700; color: #fff; cursor: pointer; line-height: 1.3; }
        .nearby-chip:disabled { opacity: 0.55; cursor: default; }
        .nearby-chip.badge-kmb { background: #d63333; }
        .nearby-chip.badge-ctb { background: #f59f00; color: #212529; }
        .nearby-chip.badge-nlb { background: #1c7ed6; }
        .nearby-attrib { font-size: 0.62rem; color: #adb5bd; margin-top: 6px; text-align: right; }
        .nearby-empty { text-align: center; color: #868e96; font-size: 0.8rem; padding: 10px 0; }
        .search-tabs { display: flex; background: #e9ecef; border-radius: 12px; padding: 3px; margin-bottom: 12px; gap: 0; }
        .search-tab { flex: 1; border: none; background: transparent; padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: 0.88rem; color: #495057; cursor: pointer; line-height: 1.2; }
        .search-tab.active { background: #fff; color: #1a1a2e; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .tab-panel[hidden] { display: none !important; }
        .input-row .route-field { flex: 0 0 64px; width: 64px; min-width: 56px; max-width: 72px; display: flex; align-items: stretch; }
        .input-row .route-field input { flex: 1 1 auto; width: 100%; min-width: 0; max-width: none; }
        .voice-btn { flex: 0 0 41px; width: 41px; height: 41px; padding: 0; border: 1px solid #ced4da; border-radius: 10px; background: #fff; cursor: pointer; font-size: 1.05rem; line-height: 1; color: #495057; }
        .voice-btn:hover { background: #f1f3f5; }
        .voice-btn.listening { background: #c92a2a; border-color: #c92a2a; color: #fff; animation: pulse 1s infinite; }
        .no-voice .voice-btn { display: none; }
        .nearby-panel { margin-top: 0; padding-top: 0; border-top: none; }
        .place-row { align-items: stretch; }
        .place-row .place-field { flex: 1 1 140px; display: flex; gap: 6px; min-width: 0; }
        .place-row .place-field input { flex: 1 1 auto; }
        .place-actions { display: flex; gap: 8px; width: 100%; }
        .place-actions .btn { flex: 1; min-width: 0; }
        .voice-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 8px 10px; background: #fff5f5; border: 1px solid #ffc9c9; border-radius: 10px; color: #c92a2a; font-size: 0.8rem; font-weight: 600; }
        .voice-bar[hidden] { display: none !important; }
        .voice-bar button { border: none; background: #c92a2a; color: #fff; border-radius: 16px; padding: 4px 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .result-section { display: flex; flex-direction: column; gap: 6px; }
        .result-title { font-size: 0.75rem; font-weight: 700; color: #868e96; letter-spacing: 0.3px; padding: 2px 2px 0; }
        .route-hit { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid #e9ecef; background: #fff; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
        .route-hit:hover { background: #f8f9fa; }
        .route-hit .route-hit-no { font-weight: 800; font-size: 1.05rem; color: #1a1a2e; min-width: 48px; }
        .route-hit .route-hit-meta { flex: 1; min-width: 0; font-size: 0.78rem; color: #495057; line-height: 1.25; }
        .nearby-results { max-height: 52vh; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🚌 全港巴士 · 實時到站</h1>
            <div class="sub-info">
                <span id="refreshTime">🔄 載入中...</span>
                <span id="gpsStatus">📡 定位中...</span>
            </div>
        </div>
        <div class="search-panel" id="searchPanel">
            <div class="search-tabs" role="tablist" aria-label="搜尋方式">
                <button type="button" class="search-tab active" id="tabRouteBtn" data-tab="route" role="tab" aria-selected="true" aria-controls="tabRoute">路線</button>
                <button type="button" class="search-tab" id="tabExploreBtn" data-tab="explore" role="tab" aria-selected="false" aria-controls="tabExplore">附近同搜尋</button>
            </div>
            <div id="tabRoute" class="tab-panel" data-panel="route" role="tabpanel" aria-labelledby="tabRouteBtn">
                <div class="input-row">
                    <select id="companySelect">
                        <option value="KMB" selected>九巴</option>
                        <option value="CTB">城巴</option>
                        <option value="NLB">嶼巴</option>
                    </select>
                    <div class="route-field">
                        <input type="text" id="routeInput" placeholder="路線" autocomplete="off" enterkeyhint="search" inputmode="numeric" aria-label="路線號碼">
                    </div>
                    <button class="dir-chip btn-outbound" id="expandOutBtn">正向</button>
                    <button class="dir-chip btn-inbound" id="expandInBtn">反向</button>
                </div>
                <select id="stationSelect" class="station-select-box">
                    <option value="">-- 請輸入路線搜尋 --</option>
                </select>
                <div class="add-row">
                    <button id="addBtn" class="btn btn-add" disabled>➕ 加入關注</button>
                    <button id="quickAddBtn" class="btn btn-quick" disabled>📍 最近站</button>
                    <button id="locateBtn" class="btn btn-locate">📡 定位</button>
                </div>
                <div class="quick-hint" id="quickHint">📍 點擊「定位」啟用 GPS，以使用最近站功能</div>
            </div>
            <div id="tabExplore" class="tab-panel nearby-panel" data-panel="explore" role="tabpanel" aria-labelledby="tabExploreBtn" hidden>
                <div class="place-row">
                    <div class="place-field">
                        <input type="text" id="placeInput" placeholder="輸入想去嘅位置，例如柴灣康民街" autocomplete="off" enterkeyhint="search" aria-label="輸入想去嘅位置">
                        <button type="button" class="voice-btn" id="placeVoiceBtn" title="語音輸入地址" aria-label="語音輸入地址">🎤</button>
                    </div>
                    <div class="place-actions">
                        <button id="placeSearchBtn" class="btn btn-place" type="button">搜尋</button>
                        <button id="nearbyGpsBtn" class="btn btn-nearby" type="button">📍 搵附近站</button>
                    </div>
                </div>
                <div class="quick-hint" id="nearbyHint">輸入想去嘅位置，會用而家定位搵附近行得到、可以去到嗰度嘅路線</div>
                <div id="nearbyResults" class="nearby-results" hidden></div>
            </div>
            <div id="voiceBar" class="voice-bar" hidden>
                <span id="voiceBarText">正在聽緊，請開始講</span>
                <button type="button" id="voiceCancelBtn">取消</button>
            </div>
        </div>
        <div class="monitor-header">
            <span class="title">📋 關注路線</span>
            <div class="actions">
                <button id="sortBtn">🔀 排序</button>
                <button id="exportBtn">📤 匯出</button>
                <button id="importBtn">📥 匯入</button>
                <button id="clearBtn" style="color:#c92a2a;">🗑️ 清空</button>
            </div>
        </div>
        <div id="busList">
            <div class="empty-message">清單空空如也，快加入路線吧！</div>
        </div>
    </div>
    <div id="toast" class="toast"></div>

    <script>
        (function() {
            'use strict';

            // ========== 配置 ==========
            const CONFIG = {
                API: {
                    KMB: 'https://data.etabus.gov.hk/v1/transport/kmb',
                    CTB: 'https://rt.data.gov.hk/v2/transport/citybus',
                    NLB: 'https://rt.data.gov.hk/v2/transport/nlb',
                    KMB_STOP_PLATES: 'https://winstonma.github.io/MMM-HK-Transport-ETA-Data/kmb/stops/allstops.json',
                    // 城巴官方冇一次過全站接口；用公開站點清單避免逐站打 /stop/{id}
                    CTB_STOPS: 'https://winstonma.github.io/MMM-HK-Transport-ETA-Data/ctb/stops/allstops.json'
                },
                GPS: { enableHighAccuracy: true, timeout: 12000, maximumAge: 3000 },
                UI: {
                    refreshInterval: 30000,
                    debounceDelay: 400,
                    walkSpeedMpm: 60,
                    maxETAShow: 3,
                    nearestDistanceThreshold: 2000, // 放宽至2公里
                    maxConcurrentRequests: 6,
                    fetchTimeoutMs: 12000,
                    nearbyRadiusM: 600,
                    nearbyMinRadiusM: 300,
                    nearbyMaxStops: 40
                },
                GEOCODE: {
                    als: 'https://www.als.gov.hk/lookup',
                    nominatim: 'https://nominatim.openstreetmap.org/search',
                    photon: 'https://photon.komoot.io/api/'
                },
                CACHE: {
                    stopTTL: 86400000,
                    routeTTL: 86400000
                },
                RETRY: { maxAttempts: 2, delayMs: 800 }
            };

            // ========== 工具函數 ==========
            const Utils = {
                safeJSONParse(str, fallback = null) { try { return JSON.parse(str); } catch { return fallback; } },
                escapeHtml(str) {
                    return String(str ?? '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#39;');
                },
                calcDistance(lat1, lon1, lat2, lon2) {
                    if (!lat1 || !lon1 || !lat2 || !lon2) return Infinity;
                    const R = 6371e3;
                    const dLat = (lat2 - lat1) * Math.PI / 180;
                    const dLon = (lon2 - lon1) * Math.PI / 180;
                    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
                    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                },
                formatTime(d) { return d.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); },
                debounce(fn, delay) { let timer = null; return function(...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), delay); }; },
                sleep(ms) { return new Promise(r => setTimeout(r, ms)); },
                getNLBStopName(stop, index) {
                    const candidates = ['stopName_c', 'stopName_tc', 'stopName_s', 'stopName_en', 'name_tc', 'stop_name_tc', 'stopName', 'name', 'stop_name', 'stopNameZh', 'nameZh', 'stopName_zh', 'stop_name_zh', 'stopNameTC', 'stopName_Tc'];
                    for (const key of candidates)
                        if (stop[key] && typeof stop[key] === 'string' && stop[key].trim() !== '') return stop[key].trim();
                    for (const key in stop)
                        if (typeof stop[key] === 'string' && stop[key].trim() !== '' && !/^\d+$/.test(stop[key]) && stop[key].length > 1) return stop[key].trim();
                    return `第 ${index+1} 站`;
                },
                stripPlateFromName(name, plate) {
                    let text = String(name || '').trim();
                    if (plate) {
                        const esc = String(plate).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        text = text.replace(new RegExp('\\s*[（(]' + esc + '[）)]\\s*$'), '').trim();
                    } else {
                        text = text.replace(/\s*[（(][A-Z]{1,3}\d{2,4}[A-Z]?[）)]\s*$/, '').trim();
                    }
                    return text;
                },
                // 同一方向若有普通班＋特別班，只保留主線站，並補上特別班獨有的站，避免清單重複
                foldStopsForDisplay(stops) {
                    const empty = { outbound: [], inbound: [] };
                    if (!stops || !stops.length) return empty;
                    const byDir = { outbound: [], inbound: [] };
                    for (const s of stops) {
                        (s.direction === 'inbound' ? byDir.inbound : byDir.outbound).push(s);
                    }
                    const fold = (list) => {
                        if (!list.length) return [];
                        const groups = new Map();
                        for (const s of list) {
                            const key = (s.company === 'NLB') ? `id:${s.routeId || ''}` : `st:${s.serviceType || 1}`;
                            if (!groups.has(key)) groups.set(key, []);
                            groups.get(key).push(s);
                        }
                        let primaryKey;
                        if (list[0].company === 'NLB') {
                            const keys = [...groups.keys()];
                            keys.sort((a, b) => {
                                const ga = groups.get(a), gb = groups.get(b);
                                const ra = ga.some(s => String(s.serviceType || 1) === '1') ? 0 : 1;
                                const rb = gb.some(s => String(s.serviceType || 1) === '1') ? 0 : 1;
                                if (ra !== rb) return ra - rb;
                                return gb.length - ga.length;
                            });
                            primaryKey = keys[0];
                        } else {
                            primaryKey = groups.has('st:1') ? 'st:1' : [...groups.keys()].sort()[0];
                        }
                        const primary = (groups.get(primaryKey) || []).slice().sort((a, b) => a.seq - b.seq);
                        const seen = new Set(primary.map(s => String(s.stopId)));
                        const extras = [];
                        for (const [key, group] of groups) {
                            if (key === primaryKey) continue;
                            for (const s of group.slice().sort((a, b) => a.seq - b.seq)) {
                                const id = String(s.stopId);
                                if (!seen.has(id)) {
                                    seen.add(id);
                                    extras.push(s);
                                }
                            }
                        }
                        return primary.concat(extras);
                    };
                    return { outbound: fold(byDir.outbound), inbound: fold(byDir.inbound) };
                },
                async parallelLimit(tasks, limit) {
                    const results = new Array(tasks.length);
                    let index = 0;
                    async function worker() {
                        while (true) {
                            const current = index++;
                            if (current >= tasks.length) break;
                            try {
                                results[current] = await tasks[current]();
                            } catch (err) {
                                results[current] = { error: err };
                            }
                        }
                    }
                    await Promise.all(
                        Array.from({ length: Math.min(limit, tasks.length) }, () => worker())
                    );
                    return results;
                }
            };


            // ========== 快取類 ==========
            class Cache {
                constructor(ttl, storageKey = null) {
                    this.ttl = ttl;
                    this.store = new Map();
                    this.storageKey = storageKey;
                    this._persistTimer = null;
                    if (storageKey) {
                        try {
                            const saved = localStorage.getItem(storageKey);
                            if (saved) {
                                const data = JSON.parse(saved);
                                for (const [key, val] of Object.entries(data)) {
                                    this.store.set(key, { value: val.value, timestamp: val.timestamp });
                                }
                            }
                        } catch (e) {}
                    }
                }
                get(key) {
                    const entry = this.store.get(key);
                    if (!entry) return null;
                    if (Date.now() - entry.timestamp > this.ttl) {
                        this.store.delete(key);
                        if (this.storageKey) this._schedulePersist();
                        return null;
                    }
                    return entry.value;
                }
                set(key, value) {
                    this.store.set(key, { value, timestamp: Date.now() });
                    if (this.storageKey) this._schedulePersist();
                }
                clear() {
                    this.store.clear();
                    if (this._persistTimer) {
                        clearTimeout(this._persistTimer);
                        this._persistTimer = null;
                    }
                    if (this.storageKey) localStorage.removeItem(this.storageKey);
                }
                _schedulePersist() {
                    if (!this.storageKey) return;
                    if (this._persistTimer) clearTimeout(this._persistTimer);
                    this._persistTimer = setTimeout(() => {
                        this._persistTimer = null;
                        this._persist();
                    }, 1000);
                }
                _persist() {
                    if (!this.storageKey) return;
                    try {
                        const obj = {};
                        for (const [key, entry] of this.store) {
                            obj[key] = { value: entry.value, timestamp: entry.timestamp };
                        }
                        localStorage.setItem(this.storageKey, JSON.stringify(obj));
                    } catch (e) {}
                }
            }

            const stopCache = new Cache(CONFIG.CACHE.stopTTL, 'bus_stop_cache');
            const routeCache = new Cache(CONFIG.CACHE.routeTTL, 'bus_route_cache_v2');

            // ========== 資料獲取器 ==========
            class Fetcher {
                static async fetchJSON(url, options = {}) {
                    const { maxAttempts = CONFIG.RETRY.maxAttempts, delayMs = CONFIG.RETRY.delayMs, timeoutMs = CONFIG.UI.fetchTimeoutMs, signal, headers } = options;
                    let lastError;
                    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                        if (signal && signal.aborted) {
                            const abortErr = new Error('已取消');
                            abortErr.name = 'AbortError';
                            throw abortErr;
                        }
                        const ctrl = new AbortController();
                        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
                        const onParentAbort = () => ctrl.abort();
                        if (signal) signal.addEventListener('abort', onParentAbort, { once: true });
                        try {
                            const res = await fetch(url, headers ? { signal: ctrl.signal, headers } : { signal: ctrl.signal });
                            if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
                            return await res.json();
                        } catch (e) {
                            lastError = e;
                            const cancelledByCaller = signal && signal.aborted;
                            const isAbort = e && (e.name === 'AbortError' || /aborted/i.test(e.message || ''));
                            if (cancelledByCaller) {
                                const abortErr = new Error('已取消');
                                abortErr.name = 'AbortError';
                                throw abortErr;
                            }
                            if (isAbort) lastError = new Error('timeout');
                            if (attempt < maxAttempts) await Utils.sleep(delayMs * attempt);
                        } finally {
                            clearTimeout(timer);
                            if (signal) signal.removeEventListener('abort', onParentAbort);
                        }
                    }
                    throw new Error(`請求失敗 (重試 ${maxAttempts} 次): ${lastError?.message||'未知錯誤'}`);
                }
            }

            // ========== 九巴／龍運站點清單（一次過載入：站名座標 + 路牌編號共用） ==========
            const KMBStops = {
                _map: Object.create(null),
                _ready: null,
                load() {
                    if (this._ready) return this._ready;
                    this._ready = this._load();
                    return this._ready;
                },
                async _load() {
                    try {
                        const json = await Fetcher.fetchJSON(CONFIG.API.KMB_STOP_PLATES, { timeoutMs: 25000 });
                        const entries = (json && typeof json === 'object' && !Array.isArray(json))
                            ? Object.values(json)
                            : (Array.isArray(json) ? json : []);
                        const map = Object.create(null);
                        for (const d of entries) {
                            if (!d || !d.stop) continue;
                            map[String(d.stop)] = {
                                stop: String(d.stop),
                                name_tc: d.name_tc || '',
                                name_en: d.name_en || '',
                                lat: d.lat,
                                long: d.long,
                                routes: Array.isArray(d.routes) ? d.routes.map(r => String(r)) : []
                            };

                        this._map = map;
                    } catch (e) {
                        console.warn('載入九巴站點清單失敗，將回退逐站請求:', e);
                        this._map = Object.create(null);
                    }
                },
                all() { return Object.values(this._map); },
                get(stopId) {
                    if (!stopId) return null;

            };

            // ========== 九巴／龍運站牌編號（官方 ETA API 沒有此欄，用同一份公開站點清單對照 stopId） ==========
            const StopPlates = {
                _map: Object.create(null),
                _ready: null,
                STORAGE_KEY: 'bus_stop_plates_v1',
                TTL_MS: 24 * 60 * 60 * 1000,
                PLATE_RE: /\(([A-Z]{1,3}\d{2,4})\)\s*$/,
                load() {
                    if (this._ready) return this._ready;
                    this._ready = this._load();
                    return this._ready;
                },
                _readCache() {
                    try {
                        const cached = Utils.safeJSONParse(localStorage.getItem(this.STORAGE_KEY), null);
                        if (cached && cached.map && typeof cached.map === 'object') return cached;
                    } catch (e) {}
                    return null;
                },
                _buildPlateMapFromStops() {
                    const map = Object.create(null);
                    for (const id of Object.keys(KMBStops._map)) {
                        const d = KMBStops._map[id];
                        const m = this.PLATE_RE.exec(String(d.name_tc || d.name_en || ''));
                        if (m) map[id] = m[1];
                    }
                    return map;
                },
                async _load() {
                    const cached = this._readCache();
                    if (cached && cached.ts && (Date.now() - cached.ts) < this.TTL_MS) {
                        this._map = cached.map;
                        // 路牌有快取時仍預熱站點清單，加速之後搜尋
                        KMBStops.load().catch(() => {});
                        return;
                    }
                    try {
                        await KMBStops.load();
                        const map = this._buildPlateMapFromStops();
                        if (Object.keys(map).length > 0) {
                            this._map = map;
                            try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify({ ts: Date.now(), map })); } catch (e) {}
                            return;
                        }
                    } catch (e) {
                        console.warn('載入站牌編號失敗:', e);
                    }
                    if (cached && cached.map) this._map = cached.map;
                },
                code(stopId) {
                    return (stopId && this._map[stopId]) || '';
                },
                label(stopName, stopId) {
                    const name = stopName || '';
                    const code = this.code(stopId);
                    if (!code) return name;
                    if (name.includes('(' + code + ')') || name.includes('（' + code + '）')) return name;
                    return name + ' (' + code + ')';
                }
            };


            // ========== 城巴站點清單（一次過載入，避免搜尋時逐站請求） ==========

            // ========== 附近站索引 + 地址地理編碼（三個入口共用同一套配對） ==========
            const NearbyIndex = {
                _nlb: [],
                _nlbReady: null,
                _nlbFailed: false,
                async ensureCore() {
                    await Promise.all([KMBStops.load(), CTBStops.load()]);
                },
                loadNLB() {
                    if (this._nlbReady) return this._nlbReady;
                    this._nlbReady = this._loadNLB().catch(err => {
                        this._nlbFailed = true;
                        this._nlbReady = null;
                        console.warn('載入嶼巴附近站失敗:', err);
                        return [];
                    });
                    return this._nlbReady;
                },
                async _loadNLB() {
                    const listCacheKey = 'NLB:routeList';
                    let listJson = routeCache.get(listCacheKey);
                    if (!listJson) {
                        listJson = await Fetcher.fetchJSON(`${CONFIG.API.NLB}/route.php?action=list`);
                        routeCache.set(listCacheKey, listJson);
                    }
                    const routes = listJson.routes || [];
                    const tasks = routes.map(rItem => async () => {
                        const routeNo = rItem.routeNo;
                        const routeId = rItem.routeId;
                        const cacheKey = `NLB:${routeNo}:all`;
                        let stops = routeCache.get(cacheKey);
                        if (!stops) {
                            const stopJson = await Fetcher.fetchJSON(`${CONFIG.API.NLB}/stop.php?action=list&routeId=${routeId}`);
                            stops = (stopJson.stops || []).map((s, idx) => ({
                                stopId: s.stopId,
                                seq: idx + 1,
                                stopName: Utils.getNLBStopName(s, idx),
                                lat: parseFloat(s.latitude) || 0,
                                lng: parseFloat(s.longitude) || 0,
                                routeId,
                                route: routeNo,
                                company: 'NLB'
                            }));
                        }
                        return { routeNo, routeId, stops };
                    });
                    const lists = await Utils.parallelLimit(tasks, CONFIG.UI.maxConcurrentRequests);
                    const byId = new Map();
                    for (const part of lists) {
                        if (!part || part.error || !part.stops) continue;
                        for (const s of part.stops) {
                            const id = String(s.stopId || '');
                            if (!id) continue;
                            let entry = byId.get(id);
                            if (!entry) {
                                entry = {
                                    company: 'NLB',
                                    stop: id,
                                    name_tc: s.stopName || '',
                                    name_en: '',
                                    lat: s.lat,
                                    long: s.lng,
                                    routes: [],
                                    routeIds: {}
                                };
                                byId.set(id, entry);
                            }
                            const routeNo = String(part.routeNo || s.route || '');
                            if (routeNo && !entry.routes.includes(routeNo)) entry.routes.push(routeNo);
                            if (routeNo) entry.routeIds[routeNo] = part.routeId || s.routeId || null;
                        }
                    }
                    this._nlb = [...byId.values()];
                    return this._nlb;
                },
                collectStops() {
                    const out = [];
                    for (const d of KMBStops.all()) {
                        const lat = parseFloat(d.lat);
                        const lng = parseFloat(d.long);
                        if (!isFinite(lat) || !isFinite(lng)) continue;
                        out.push({
                            company: 'KMB',
                            stopId: d.stop,
                            stopName: d.name_tc || d.name_en || '未知站',
                            lat, lng,
                            routes: d.routes || []
                        });
                    }
                    for (const d of CTBStops.all()) {
                        const lat = parseFloat(d.lat);
                        const lng = parseFloat(d.long);
                        if (!isFinite(lat) || !isFinite(lng)) continue;
                        out.push({
                            company: 'CTB',
                            stopId: d.stop,
                            stopName: d.name_tc || d.name_en || '未知站',
                            lat, lng,
                            routes: d.routes || []
                        });
                    }
                    for (const d of this._nlb) {
                        const lat = parseFloat(d.lat);
                        const lng = parseFloat(d.long);
                        if (!isFinite(lat) || !isFinite(lng)) continue;
                        out.push({
                            company: 'NLB',
                            stopId: d.stop,
                            stopName: d.name_tc || '未知站',
                            lat, lng,
                            routes: d.routes || [],
                            routeIds: d.routeIds || {}
                        });
                    }
                    return out;
                },
                walkMins(dist) {
                    const speed = CONFIG.UI.walkSpeedMpm || 60;
                    if (!isFinite(dist) || dist < 0) return null;
                    return Math.max(1, Math.ceil(dist / speed));
                },
                findNearby(lat, lng, radiusM, maxStops) {
                    const radius = radiusM || CONFIG.UI.nearbyRadiusM;
                    const limit = (maxStops == null) ? CONFIG.UI.nearbyMaxStops : maxStops;
                    const hits = [];
                    for (const s of this.collectStops()) {
                        const dist = Utils.calcDistance(lat, lng, s.lat, s.lng);
                        if (!isFinite(dist) || dist > radius) continue;
                        if (!s.routes || s.routes.length === 0) continue;
                        hits.push(Object.assign({}, s, { dist: Math.round(dist), walkMins: this.walkMins(dist) }));
                    }
                    hits.sort((a, b) => a.dist - b.dist || a.stopName.localeCompare(b.stopName, 'zh-Hant'));
                    if (!isFinite(limit)) return hits;
                    return hits.slice(0, limit);
                },
                nearbyRoutes(lat, lng, radiusM) {
                    const stops = this.findNearby(lat, lng, radiusM, Infinity);
                    const map = new Map();
                    for (const stop of stops) {
                        for (const route of stop.routes || []) {
                            if (!route) continue;
                            const key = `${stop.company}|${route}`;
                            const prev = map.get(key);
                            if (!prev || stop.dist < prev.dist) {
                                map.set(key, {
                                    company: stop.company,
                                    route,
                                    stopId: stop.stopId,
                                    stopName: stop.stopName,
                                    lat: stop.lat,
                                    lng: stop.lng,
                                    routeId: (stop.routeIds && stop.routeIds[route]) ? String(stop.routeIds[route]) : '',
                                    dist: stop.dist,
                                    walkMins: stop.walkMins != null ? stop.walkMins : this.walkMins(stop.dist)
                                });
                            }
                        }
                    }
                    return [...map.values()].sort((a, b) => a.dist - b.dist || String(a.route).localeCompare(String(b.route), 'zh-Hant', { numeric: true }));
                },
                routesToDestination(originLat, originLng, destLat, destLng, radiusM) {
                    const radius = radiusM || CONFIG.UI.nearbyRadiusM;
                    const originStops = this.findNearby(originLat, originLng, radius, Infinity);
                    const destStops = this.findNearby(destLat, destLng, radius, Infinity);
                    const destByKey = new Map();
                    for (const stop of destStops) {
                        for (const route of stop.routes || []) {
                            if (!route) continue;
                            const key = `${stop.company}|${route}`;
                            const prev = destByKey.get(key);
                            if (!prev || stop.dist < prev.dist) destByKey.set(key, Object.assign({}, stop, { route }));
                        }
                    }
                    const isAlightOnly = (stop) => /落客/.test(String(stop.stopName || ''));
                    const map = new Map();
                    for (const stop of originStops) {
                        for (const route of stop.routes || []) {
                            if (!route) continue;
                            const key = `${stop.company}|${route}`;
                            const alight = destByKey.get(key);
                            if (!alight) continue;
                            if (String(alight.stopId) === String(stop.stopId)) continue;
                            const prev = map.get(key);
                            const worseAlightOnly = prev && isAlightOnly(prev) && !isAlightOnly(stop);
                            const better = !prev || worseAlightOnly || (stop.dist < prev.dist && !(isAlightOnly(stop) && !isAlightOnly(prev)));
                            if (better) {
                                map.set(key, {
                                    kind: 'journey',
                                    company: stop.company,
                                    route,
                                    stopId: stop.stopId,
                                    stopName: stop.stopName,
                                    lat: stop.lat,
                                    lng: stop.lng,
                                    routeId: (stop.routeIds && stop.routeIds[route]) ? String(stop.routeIds[route]) : ((alight.routeIds && alight.routeIds[route]) ? String(alight.routeIds[route]) : ''),
                                    dist: stop.dist,
                                    walkMins: stop.walkMins != null ? stop.walkMins : this.walkMins(stop.dist),
                                    destStopId: alight.stopId,
                                    destStopName: alight.stopName,
                                    destLat: alight.lat,
                                    destLng: alight.lng,
                                    destDist: alight.dist,
                                    destWalkMins: alight.walkMins != null ? alight.walkMins : this.walkMins(alight.dist)
                                });
                            }
                        }
                    }
                    return [...map.values()].sort((a, b) => a.dist - b.dist || String(a.route).localeCompare(String(b.route), 'zh-Hant', { numeric: true }));
                },
                _norm(text) {
                    return String(text || '').toLowerCase().replace(/\s+/g, '');
                },
                looksLikeRoute(query) {
                    return /^[A-Za-z]{0,2}\d{1,4}[A-Za-z]{0,2}$/.test(String(query || '').trim());
                },
                looksLikePlace(query) {
                    const q = String(query || '').trim();
                    if (!q || this.looksLikeRoute(q)) return false;
                    if (/[\u4e00-\u9fff]/.test(q)) return true;
                    if (/\s/.test(q) && q.length >= 3) return true;
                    if (q.length >= 4 && /[A-Za-z]/.test(q)) return true;
                    return false;
                },
                searchStops(query, origin, limit) {
                    const q = this._norm(query);
                    if (!q) return [];
                    const cap = limit || CONFIG.UI.nearbyMaxStops;
                    const hasOrigin = origin && isFinite(origin.lat) && isFinite(origin.lng);
                    const hits = [];
                    for (const s of this.collectStops()) {
                        const name = this._norm(s.stopName);
                        const id = this._norm(s.stopId);
                        const routes = (s.routes || []).some(r => this._norm(r) === q || this._norm(r).startsWith(q));
                        if (!name.includes(q) && !id.includes(q) && !routes) continue;
                        const dist = hasOrigin ? Math.round(Utils.calcDistance(origin.lat, origin.lng, s.lat, s.lng)) : null;
                        hits.push(Object.assign({}, s, { dist: isFinite(dist) ? dist : null }));
                    }
                    hits.sort((a, b) => {
                        const da = isFinite(a.dist) ? a.dist : 999999;
                        const db = isFinite(b.dist) ? b.dist : 999999;
                        if (da !== db) return da - db;
                        return a.stopName.localeCompare(b.stopName, 'zh-Hant');
                    });
                    return hits.slice(0, cap);
                },
                async loadRouteCatalog() {
                    if (this._routeCatalog) return this._routeCatalog;
                    await this.ensureCore();
                    const catalog = [];
                    let kmbList = routeCache.get('KMB:routeList');
                    if (!kmbList) {
                        try {
                            const json = await Fetcher.fetchJSON(`${CONFIG.API.KMB}/route/`);
                            kmbList = json.data || [];

                        if (!row) {
                            row = { company: 'KMB', route, orig: r.orig_tc || '', dest: r.dest_tc || '' };
                            kmbMap.set(route, row);
                        } else if ((r.bound === 'I' || r.bound === 'inbound') && (r.orig_tc || r.dest_tc)) {
                            if (!row.orig) row.orig = r.dest_tc || row.orig;
                            if (!row.dest) row.dest = r.orig_tc || row.dest;
                        }
                    }
                    catalog.push(...kmbMap.values());
                    const ctb = new Set();
                    for (const s of CTBStops.all()) {
                        for (const route of (s.routes || [])) {
                            if (route) ctb.add(String(route));
                        }
                    }
                    for (const route of [...ctb].sort()) catalog.push({ company: 'CTB', route, orig: '', dest: '' });
                    try {
                        const listCacheKey = 'NLB:routeList';
                        let listJson = routeCache.get(listCacheKey);
                        if (!listJson) {
                            listJson = await Fetcher.fetchJSON(`${CONFIG.API.NLB}/route.php?action=list`);
                            routeCache.set(listCacheKey, listJson);
                        }
                        const seen = new Set();
                        for (const r of (listJson.routes || [])) {
                            const route = String(r.routeNo || '').trim();
                            if (!route || seen.has(route)) continue;
                            seen.add(route);
                            const name = String(r.routeName_c || r.routeName_e || '');
                            const parts = name.split(/\s*>\s*/);
                            catalog.push({
                                company: 'NLB',
                                route,
                                orig: (parts[0] || '').trim(),
                                dest: parts.length > 1 ? parts.slice(1).join(' > ').trim() : ''
                            });
                        }
                    } catch (e) {}
                    this._routeCatalog = catalog;
                    return catalog;
                },
                async searchRoutes(query, limit) {
                    const q = this._norm(query);
                    if (!q) return [];
                    const cap = limit || 20;
                    const catalog = await this.loadRouteCatalog();
                    const hits = [];
                    for (const r of catalog) {
                        const route = this._norm(r.route);
                        const orig = this._norm(r.orig);
                        const dest = this._norm(r.dest);
                        const exact = route === q;
                        const prefix = route.startsWith(q);
                        const text = orig.includes(q) || dest.includes(q);
                        if (!exact && !prefix && !text && !route.includes(q)) continue;
                        hits.push(Object.assign({ _rank: exact ? 0 : prefix ? 1 : 2 }, r));
                    }
                    hits.sort((a, b) => a._rank - b._rank || a.route.localeCompare(b.route, 'en', { numeric: true }) || a.company.localeCompare(b.company));
                    return hits.slice(0, cap);
                }
            };

            const Geocoder = {
                _lastAt: 0,
                _inHK(lat, lon) {
                    return lat >= 22.12 && lat <= 22.58 && lon >= 113.75 && lon <= 114.52;
                },
                _areas: ['西營盤','堅尼地城','尖沙咀','銅鑼灣','黃竹坑','荔枝角','長沙灣','深水埗','石硤尾','九龍塘','九龍城','何文田','紅磡','土瓜灣','新蒲崗','鑽石山','黃大仙','橫頭磡','慈雲山','牛頭角','九龍灣','將軍澳','調景嶺','天水圍','馬鞍山','清水灣','鰂魚涌','西灣河','筲箕灣','杏花邨','小西灣','香港仔','鴨脷洲','淺水灣','油麻地','美孚','樂富','彩虹','藍田','油塘','坑口','寶琳','康城','葵涌','葵芳','青衣','屯門','元朗','錦田','大埔','太和','粉嶺','上水','大圍','火炭','東涌','欣澳','西貢','長洲','坪洲','梅窩','南丫','炮台山','天后','大坑','灣仔','金鐘','中環','上環','薄扶林','赤柱','海怡','佐敦','旺角','太子','觀塘','荃灣','沙田','北角','太古','柴灣','朗屏','兆康','大學','迪士尼','烏溪沙'],
                _streetPat: /[^\d\s,，、]{1,8}(?:大道[東西中]?|大街|公路|道[東西南北]?|街|路|里|巷)/g,
                _suffixOnly: /^(大道[東西中]?|大街|公路|道[東西南北]?|街|路|里|巷)$/,
                _parseQuery(query) {
                    const q = String(query || '').trim();
                    const numM = q.match(/(\d+)\s*(?:[-–至]\s*(\d+))?\s*號/);
                    let body = q;
                    if (numM) body = body.replace(numM[0], '');
                    body = body.replace(/香港特別行政區|香港|九龍|新界/g, '').replace(/[,\s，、]/g, '');
                    let area = '';
                    const areas = this._areas.slice().sort((a, b) => b.length - a.length);
                    for (const a of areas) {
                        if (!body.startsWith(a)) continue;
                        const rest = body.slice(a.length);
                        if (rest && this._suffixOnly.test(rest)) continue;
                        area = a;
                        body = rest;
                        break;
                    }
                    const streets = body.match(this._streetPat) || [];
                    if (!area && !streets.length) area = body;
                    return {
                        raw: q,
                        number: numM ? numM[1] : '',
                        streets,
                        area
                    };
                },
                _formatAlsLabel(row, areaHint) {
                    const streetName = row.streetName || '';
                    let streetNo = '';
                    if (streetName && row.noFrom) {
                        streetNo = (row.noTo && row.noTo !== row.noFrom)
                            ? `${streetName}${row.noFrom}至${row.noTo}號`
                            : `${streetName}${row.noFrom}號`;
                    } else {
                        streetNo = streetName;
                    }
                    const chunks = [];
                    const area = areaHint || '';
                    const already = streetNo + (row.building || '') + (row.estate || '');
                    if (area && !already.includes(area)) chunks.push(area);
                    if (streetNo) chunks.push(streetNo);
                    if (row.building && !chunks.join('').includes(row.building)) chunks.push(row.building);
                    else if (!row.building && row.estate && !chunks.join('').includes(row.estate)) chunks.push(row.estate);
                    return chunks.join('') || row.label || '已定位位置';
                },
                _numberMatches(row, number) {
                    if (!number) return false;
                    const n = parseInt(number, 10);
                    const a = parseInt(row.noFrom, 10);
                    const b = parseInt(row.noTo || row.noFrom, 10);
                    if (!isFinite(n) || !isFinite(a)) return false;
                    const lo = Math.min(a, isFinite(b) ? b : a);
                    const hi = Math.max(a, isFinite(b) ? b : a);
                    return n >= lo && n <= hi;
                },
                _streetMatches(row, streets) {
                    if (!streets || !streets.length) return false;
                    const name = String(row.streetName || '');
                    if (!name) return false;
                    return streets.some(s => name === s || name.includes(s) || s.includes(name));
                },
                _textHas(row, token) {
                    if (!token) return false;
                    const blob = [row.building, row.estate, row.district, row.region, row.streetName].join('');
                    return blob.includes(token);
                },
                _median(values) {
                    const arr = values.slice().sort((a, b) => a - b);
                    const mid = Math.floor(arr.length / 2);
                    return arr.length % 2 ? arr[mid] : (arr[mid - 1] + arr[mid]) / 2;
                },
                _approxDist(aLat, aLng, bLat, bLng) {
                    const dlat = (aLat - bLat) * 111000;
                    const dlng = (aLng - bLng) * 111000 * Math.cos(((aLat + bLat) / 2) * Math.PI / 180);
                    return Math.hypot(dlat, dlng);
                },
                _medianPin(rows, label) {
                    if (!rows.length) return null;
                    let lat = this._median(rows.map(r => r.lat));
                    let lng = this._median(rows.map(r => r.lng));
                    const kept = rows.filter(r => this._approxDist(r.lat, r.lng, lat, lng) <= 700);
                    const use = kept.length >= 2 ? kept : rows;
                    lat = this._median(use.map(r => r.lat));
                    lng = this._median(use.map(r => r.lng));
                    const nearest = use.slice().sort((a, b) => this._approxDist(a.lat, a.lng, lat, lng) - this._approxDist(b.lat, b.lng, lat, lng))[0];
                    return {
                        lat,
                        lng,
                        label: label || (nearest && nearest.label) || '已定位位置',
                        source: 'ALS'
                    };
                },
                _rowFromAls(s) {
                    const prem = (s && s.Address && s.Address.PremisesAddress) || {};
                    const chi = prem.ChiPremisesAddress || {};
                    const geo = prem.GeospatialInformation || {};
                    const lat = parseFloat(geo.Latitude);
                    const lng = parseFloat(geo.Longitude);
                    if (!isFinite(lat) || !isFinite(lng) || !this._inHK(lat, lng)) return null;
                    const street = chi.ChiStreet || {};
                    const district = (chi.ChiDistrict || {}).DcDistrict || '';
                    const estateObj = chi.ChiEstate;
                    const estate = (estateObj && (estateObj.EstateName || (estateObj.ChiEstateName && estateObj.ChiEstateName.EstateName))) || (typeof estateObj === 'string' ? estateObj : '') || '';
                    const row = {
                        lat,
                        lng,
                        source: 'ALS',
                        score: parseFloat((s.ValidationInformation || {}).Score) || 0,
                        streetName: street.StreetName || '',
                        noFrom: street.BuildingNoFrom || '',
                        noTo: street.BuildingNoTo || '',
                        building: chi.BuildingName || '',
                        estate,
                        district,
                        region: chi.Region || ''
                    };
                    row.label = this._formatAlsLabel(row);
                    return row;
                },
                _pickAls(query, rows) {
                    if (!rows.length) return null;
                    const parsed = this._parseQuery(query);
                    for (const r of rows) r.label = this._formatAlsLabel(r, parsed.area);

                    if (parsed.number) {
                        const numbered = rows.filter(r => this._numberMatches(r, parsed.number));
                        if (numbered.length) {
                            const streetPool = parsed.streets.length
                                ? numbered.filter(r => this._streetMatches(r, parsed.streets))
                                : numbered;
                            const best = (streetPool.length ? streetPool : numbered).slice().sort((a, b) => b.score - a.score)[0];
                            return { lat: best.lat, lng: best.lng, label: best.label, source: 'ALS' };
                        }
                    }

                    const isStreetQuery = parsed.streets.length > 0 && !parsed.number;
                    if (isStreetQuery) {
                        let streetRows = rows.filter(r => this._streetMatches(r, parsed.streets));
                        if (parsed.area) {
                            const areaRows = streetRows.filter(r => this._textHas(r, parsed.area));
                            if (areaRows.length) streetRows = areaRows;
                        }
                        if (streetRows.length >= 2) {
                            const label = parsed.area ? `${parsed.area}${parsed.streets[0]}` : parsed.streets[0];
                            return this._medianPin(streetRows, label);
                        }
                        if (streetRows.length === 1) {
                            return { lat: streetRows[0].lat, lng: streetRows[0].lng, label: streetRows[0].label, source: 'ALS' };
                        }
                    }

                    const named = rows.filter(r => {
                        const blob = `${r.building || ''}${r.estate || ''}`;
                        if (!blob) return false;
                        if (blob.includes(parsed.raw) || parsed.raw.includes(blob)) return true;
                        return parsed.area && blob.includes(parsed.area);
                    });
                    if (named.length) {
                        const estateName = named[0].estate;
                        const sameEstate = estateName ? named.filter(r => r.estate === estateName) : [];
                        if (sameEstate.length >= 3) return this._medianPin(sameEstate, estateName || query);
                        const best = named.slice().sort((a, b) => b.score - a.score)[0];
                        return { lat: best.lat, lng: best.lng, label: best.label, source: 'ALS' };
                    }

                    const best = rows.slice().sort((a, b) => b.score - a.score)[0];
                    return { lat: best.lat, lng: best.lng, label: best.label, source: 'ALS' };
                },
                async _waitRateLimit() {
                    const wait = 1100 - (Date.now() - this._lastAt);
                    if (wait > 0) await Utils.sleep(wait);
                    this._lastAt = Date.now();
                },
                async _als(query, signal) {
                    const params = new URLSearchParams({ q: query, n: '20' });
                    const url = `${CONFIG.GEOCODE.als}?${params.toString()}`;
                    const json = await Fetcher.fetchJSON(url, {
                        signal,
                        maxAttempts: 1,
                        timeoutMs: 10000,
                        headers: { 'Accept': 'application/json', 'Accept-Language': 'zh-Hant,zh-HK' }
                    });
                    const rows = [];
                    for (const s of (json && json.SuggestedAddress) || []) {
                        const row = this._rowFromAls(s);
                        if (row) rows.push(row);
                    }
                    return this._pickAls(query, rows);
                },
                async _nominatim(query, signal) {
                    const params = new URLSearchParams({
                        format: 'json',
                        limit: '3',
                        countrycodes: 'hk',
                        'accept-language': 'zh-Hant,zh-HK,en',
                        viewbox: '113.75,22.58,114.52,22.12',
                        q: query
                    });
                    const url = `${CONFIG.GEOCODE.nominatim}?${params.toString()}`;
                    const json = await Fetcher.fetchJSON(url, { signal, maxAttempts: 1, timeoutMs: 10000 });
                    const rows = Array.isArray(json) ? json : [];
                    for (const row of rows) {
                        const lat = parseFloat(row.lat);
                        const lon = parseFloat(row.lon);
                        if (!isFinite(lat) || !isFinite(lon)) continue;
                        if (!this._inHK(lat, lon)) continue;
                        return { lat, lng: lon, label: row.display_name || query, source: 'Nominatim' };
                    }
                    return null;
                },
                async _photon(query, signal) {
                    const params = new URLSearchParams({
                        q: query,
                        lang: 'zh',
                        limit: '5',
                        lat: '22.3',
                        lon: '114.17'
                    });
                    const url = `${CONFIG.GEOCODE.photon}?${params.toString()}`;
                    const json = await Fetcher.fetchJSON(url, { signal, maxAttempts: 1, timeoutMs: 10000 });
                    const feats = (json && json.features) || [];
                    for (const f of feats) {
                        const coords = f.geometry && f.geometry.coordinates;
                        if (!coords || coords.length < 2) continue;
                        const lon = parseFloat(coords[0]);
                        const lat = parseFloat(coords[1]);
                        if (!isFinite(lat) || !isFinite(lon) || !this._inHK(lat, lon)) continue;
                        const p = f.properties || {};
                        const label = [p.name, p.district, p.city, p.state].filter(Boolean).join('，') || query;
                        return { lat, lng: lon, label, source: 'Photon' };
                    }
                    return null;
                },
                async search(query, signal) {
                    const q0 = String(query || '').trim();
                    if (!q0) throw new Error('請輸入地址或地區名稱');
                    let lastErr = null;
                    try {
                        const hit = await this._als(q0, signal);
                        if (hit) return hit;
                    } catch (e) {
                        if (e && e.name === 'AbortError') throw e;
                        lastErr = e;
                    }
                    const variants = [q0];
                    if (!/[香港九龍新界港島]|Hong Kong|Kowloon/i.test(q0)) {
                        variants.push(`${q0} 香港`);
                        variants.push(`${q0}, Hong Kong`);
                    }
                    for (const q of variants) {
                        await this._waitRateLimit();
                        try {
                            const hit = await this._nominatim(q, signal);
                            if (hit) return hit;
                        } catch (e) {
                            if (e && e.name === 'AbortError') throw e;
                            lastErr = e;
                        }
                    }
                    for (const q of variants) {
                        try {
                            const hit = await this._photon(q, signal);
                            if (hit) return hit;
                        } catch (e) {
                            if (e && e.name === 'AbortError') throw e;
                            lastErr = e;
                        }
                    }
                    if (lastErr) throw lastErr;
                    return null;
                }
