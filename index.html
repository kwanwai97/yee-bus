            const VoiceInput = {
                _rec: null,
                _target: null,
                supported() {
                    return typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
                },
                isListening() { return !!this._rec; },
                stop() {
                    const rec = this._rec;
                    this._rec = null;
                    this._target = null;
                    if (!rec) return;
                    try { rec.onresult = rec.onerror = rec.onend = rec.onspeechend = null; } catch (e) {}
                    try { rec.abort(); } catch (e) {
                        try { rec.stop(); } catch (e2) {}
                    }
                },
                start(inputEl, opts) {
                    const options = opts || {};
                    if (!this.supported()) {
                        if (options.onError) options.onError(new Error('呢部裝置唔支援語音輸入'));
                        return false;
                    }
                    this.stop();
                    const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const rec = new Ctor();
                    rec.lang = 'zh-HK';
                    rec.interimResults = true;
                    rec.continuous = false;
                    rec.maxAlternatives = 1;
                    this._rec = rec;
                    this._target = inputEl;
                    rec.onresult = (event) => {
                        let interim = '';
                        let finalText = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            const piece = event.results[i][0] && event.results[i][0].transcript ? event.results[i][0].transcript : '';
                            if (event.results[i].isFinal) finalText += piece;
                            else interim += piece;
                        }
                        const text = (finalText || interim).trim();
                        if (text && inputEl) inputEl.value = text;
                        if (finalText && options.onFinal) options.onFinal(finalText.trim());
                    };
                    rec.onerror = (event) => {
                        const err = (event && event.error) || '';
                        if (err === 'aborted' || err === 'canceled') return;
                        let msg = '語音輸入失敗';
                        if (err === 'not-allowed') msg = '語音權限被拒，請喺瀏覽器設定允許麥克風';
                        else if (err === 'no-speech') msg = '聽唔到，請再試一次';
                        else if (err === 'audio-capture') msg = '搵唔到麥克風';
                        else if (err === 'network') msg = '語音服務網絡錯誤';
                        if (options.onError) options.onError(new Error(msg));
                    };
                    rec.onend = () => {
                        const ended = this._rec === rec;
                        if (ended) this._rec = null;
                        if (options.onEnd) options.onEnd();
                    };
                    try {
                        rec.start();
                        if (options.onStart) options.onStart();
                        return true;
                    } catch (e) {
                        this._rec = null;
                        if (options.onError) options.onError(e);
                        return false;
                    }
                }
            };

            // ========== 巴士 API（含修复） ==========
            class BusAPI {
                static async getStops(company, route, direction = null, signal = null) {
                    const cacheKey = `${company}:${route}:${direction||'all'}`;
                    const cached = routeCache.get(cacheKey);
                    if (cached) return cached;
                    // If requesting a specific direction and we have "all" cached, reuse it
                    if (direction) {
                        const allCached = routeCache.get(`${company}:${route}:all`);
                        if (allCached) {
                            const filtered = allCached.filter(s => s.direction === direction);
                            if (filtered.length > 0) {
                                routeCache.set(cacheKey, filtered);
                                return filtered;
                            }
                        }
                    }
                    let stops = [];
                    try {
                        if (company === 'KMB') stops = await this._fetchKMBStops(route, direction, signal);
                        else if (company === 'CTB') stops = await this._fetchCTBStops(route, direction, signal);
                        else if (company === 'NLB') stops = await this._fetchNLBStops(route, signal);
                    } catch (e) {
                        console.error('獲取車站失敗:', e);
                        throw e;
                    }
                    const normalized = stops.map(s => ({
                        stopId: s.stopId,
                        seq: s.seq,
                        direction: s.direction || 'outbound',
                        stopName: s.stopName || '未知站',
                        lat: s.lat || 0,
                        lng: s.lng || 0,
                        serviceType: s.serviceType || 1,
                        routeId: s.routeId || null,
                        variantOrig: s.variantOrig || '',
                        variantDest: s.variantDest || '',
                        company,
                        route
                    }));
                    routeCache.set(cacheKey, normalized);
                    if (!direction) {
                        const outbound = normalized.filter(s => s.direction === 'outbound');
                        const inbound = normalized.filter(s => s.direction === 'inbound');
                        if (outbound.length) routeCache.set(`${company}:${route}:outbound`, outbound);
                        if (inbound.length) routeCache.set(`${company}:${route}:inbound`, inbound);
                    }
                    return normalized;
                }

                static async _getKMBRouteVariants(route, signal) {
                    const listCacheKey = 'KMB:routeList';
                    let list = routeCache.get(listCacheKey);
                    if (!list) {
                        const json = await Fetcher.fetchJSON(`${CONFIG.API.KMB}/route/`, { signal });
                        list = json.data || [];
                        routeCache.set(listCacheKey, list);
                    }
                    const wanted = String(route).toUpperCase();
                    return list.filter(r => String(r.route).toUpperCase() === wanted);
                }
                static _boundToDir(bound) {
                    return (bound === 'I' || bound === 'inbound') ? 'inbound' : 'outbound';
                }
                static async _fetchKMBStops(route, direction, signal) {
                    await KMBStops.load();
                    const variants = await this._getKMBRouteVariants(route, signal);
                    let pairs = [];
                    if (variants.length > 0) {
                        const seen = new Set();
                        for (const v of variants) {
                            const dir = this._boundToDir(v.bound);
                            if (direction && dir !== direction) continue;
                            const serviceType = String(v.service_type || '1');
                            const key = `${dir}:${serviceType}`;
                            if (seen.has(key)) continue;
                            seen.add(key);
                            pairs.push({ dir, serviceType, dest_tc: v.dest_tc || '', orig_tc: v.orig_tc || '' });
                        }
                    } else {
                        const dirs = direction ? [direction] : ['outbound', 'inbound'];
                        pairs = dirs.map(dir => ({ dir, serviceType: '1', dest_tc: '', orig_tc: '' }));
                    }
                    const pairResults = await Promise.all(pairs.map(async (p) => {
                        const url = `${CONFIG.API.KMB}/route-stop/${route}/${p.dir}/${p.serviceType}`;
                        const json = await Fetcher.fetchJSON(url, { signal });
                        return { p, data: json.data || [] };
                    }));
                    const missing = [];
                    const seenMiss = new Set();
                    for (const { data } of pairResults) {
                        for (const item of data) {
                            const id = item && item.stop;
                            if (!id) continue;
                            if (KMBStops.get(id) || stopCache.get(`KMB:stop:${id}`)) continue;
                            if (seenMiss.has(id)) continue;
                            seenMiss.add(id);
                            missing.push(id);
                        }
                    }
                    if (missing.length > 0) {
                        await Utils.parallelLimit(
                            missing.map(id => () => this._getKMBStopDetail(id, signal)),
                            8
                        );
                    }
                    const all = [];
                    for (const { p, data } of pairResults) {
                        for (const item of data) {
                            const id = item.stop;
                            const stopInfo = KMBStops.get(id) || stopCache.get(`KMB:stop:${id}`) || {};
                            all.push({
                                stopId: id,
                                seq: parseInt(item.seq, 10) || 0,
                                direction: p.dir,
                                serviceType: item.service_type || p.serviceType,
                                stopName: stopInfo.name_tc || '九巴車站',
                                lat: parseFloat(stopInfo.lat) || 0,
                                lng: parseFloat(stopInfo.long) || 0,
                                variantDest: p.dest_tc || '',
                                variantOrig: p.orig_tc || ''
                            });
                        }
                    }
                    return all;
                }
                static async _getKMBStopDetail(stopId, signal) {
                    const cacheKey = `KMB:stop:${stopId}`;
                    const cached = stopCache.get(cacheKey);
                    if (cached) return cached;
                    const url = `${CONFIG.API.KMB}/stop/${stopId}`;
                    const json = await Fetcher.fetchJSON(url, { signal });
                    const data = json.data || {};
                    stopCache.set(cacheKey, data);
                    return data;
                }

                static async _fetchCTBStops(route, direction, signal) {
                    // 先載入全站清單（約一次／日內），再只打 route-stop；缺漏站先回退單站 API
                    await CTBStops.load();
                    const dirs = direction ? [direction] : ['outbound', 'inbound'];
                    const lists = await Promise.all(dirs.map(async (dir) => {
                        const url = `${CONFIG.API.CTB}/route-stop/CTB/${route}/${dir}`;
                        const json = await Fetcher.fetchJSON(url, { signal });
                        return { dir, data: json.data || [] };
                    }));
                    const missing = [];
                    const seenMiss = new Set();
                    for (const { data } of lists) {
                        for (const item of data) {
                            const id = item && item.stop;
                            if (!id) continue;
                            if (CTBStops.get(id) || stopCache.get(`CTB:stop:${id}`)) continue;
                            if (seenMiss.has(id)) continue;
                            seenMiss.add(id);
                            missing.push(id);
                        }
                    }
                    if (missing.length > 0) {
                        await Utils.parallelLimit(
                            missing.map(id => () => this._getCTBStopDetail(id, signal)),
                            8
                        );
                    }
                    const all = [];
                    for (const { dir, data } of lists) {
                        for (const item of data) {
                            const id = item.stop;
                            const stopInfo = CTBStops.get(id) || stopCache.get(`CTB:stop:${id}`) || {};
                            all.push({
                                stopId: id,
                                seq: parseInt(item.seq, 10) || 0,
                                direction: dir,
                                stopName: stopInfo.name_tc || '城巴車站',
                                lat: parseFloat(stopInfo.lat) || 0,
                                lng: parseFloat(stopInfo.long) || 0
                            });
                        }
                    }
                    return all;
                }
                static async _getCTBStopDetail(stopId, signal) {
                    const cacheKey = `CTB:stop:${stopId}`;
                    const cached = stopCache.get(cacheKey);
                    if (cached) return cached;
                    const url = `${CONFIG.API.CTB}/stop/${stopId}`;
                    const json = await Fetcher.fetchJSON(url, { signal });
                    const data = json.data || {};
                    stopCache.set(cacheKey, data);
                    return data;
                }

                // 嶼巴公開資料沒有 bound 欄，用路線名稱「起點 > 終點」判斷去程／回程
                static _parseNLBName(name) {
                    const text = String(name || '');
                    const parts = text.split(/\s*>\s*/);
                    if (parts.length >= 2) return { orig: parts[0].trim(), dest: parts.slice(1).join(' > ').trim() };
                    return { orig: '', dest: text.trim() };
                }
                static _nlbCore(name) {
                    return String(name || '').replace(/[（(][^）)]*[）)]/g, '').replace(/\s+/g, '').trim();
                }
                static _inferNLBDirections(matchedRoutes) {
                    const parsed = matchedRoutes.map(r => {
                        const { orig, dest } = this._parseNLBName(r.routeName_c || r.routeName_e || '');
                        const special = Number(r.specialRoute) === 1 || /[（(][^）)]*開[）)]/.test(orig);
                        return { r, orig, dest, coreOrig: this._nlbCore(orig), coreDest: this._nlbCore(dest), special };
                    });
                    const regular = parsed.filter(p => !p.special);
                    const base = regular[0] || parsed[0];
                    const outOrig = base ? base.coreOrig : '';
                    const outDest = base ? base.coreDest : '';
                    const map = new Map();
                    for (const p of parsed) {
                        let direction = 'outbound';
                        if (p.coreOrig === outOrig && p.coreDest === outDest) direction = 'outbound';
                        else if (p.coreOrig === outDest && p.coreDest === outOrig) direction = 'inbound';
                        else if (p.coreDest === outDest || p.coreOrig === outOrig) direction = 'outbound';
                        else if (p.coreDest === outOrig || p.coreOrig === outDest) direction = 'inbound';
                        const mainOrig = direction === 'outbound' ? outOrig : outDest;
                        const isVariant = p.special || p.coreOrig !== mainOrig;
                        map.set(p.r.routeId, {
                            direction,
                            variantOrig: p.orig,
                            variantDest: p.dest,
                            serviceType: isVariant ? 2 : 1
                        });
                    }
                    return map;
                }
                static async _fetchNLBStops(route, signal) {
                    const listCacheKey = 'NLB:routeList';
                    let listJson = routeCache.get(listCacheKey);
                    if (!listJson) {
                        const listUrl = `${CONFIG.API.NLB}/route.php?action=list`;
                        listJson = await Fetcher.fetchJSON(listUrl, { signal });
                        routeCache.set(listCacheKey, listJson);
                    }
                    const routes = listJson.routes || [];
                    const matchedRoutes = routes.filter(r => r.routeNo.toUpperCase() === route.toUpperCase());
                    if (matchedRoutes.length === 0) throw new Error(`找不到嶼巴路線 ${route}`);
                    const dirMap = this._inferNLBDirections(matchedRoutes);
                    const lists = await Promise.all(matchedRoutes.map(async (rItem) => {
                        const routeId = rItem.routeId;
                        const meta = dirMap.get(routeId) || { direction: 'outbound', variantOrig: '', variantDest: '', serviceType: 1 };
                        const stopUrl = `${CONFIG.API.NLB}/stop.php?action=list&routeId=${routeId}`;
                        const stopJson = await Fetcher.fetchJSON(stopUrl, { signal });
                        return { routeId, meta, stops: stopJson.stops || [] };
                    }));
                    const allStops = [];
                    for (const { routeId, meta, stops } of lists) {
                        stops.forEach((s, idx) => {
                            allStops.push({
                                stopId: s.stopId,
                                seq: idx + 1,
                                direction: meta.direction,
                                serviceType: meta.serviceType,
                                stopName: Utils.getNLBStopName(s, idx),
                                lat: parseFloat(s.latitude) || 0,
                                lng: parseFloat(s.longitude) || 0,
                                routeId: routeId,
                                variantOrig: meta.variantOrig,
                                variantDest: meta.variantDest
                            });
                        });
                    }
                    return allStops;
                }

                static _cachedRouteStops(company, route, direction) {
                    return routeCache.get(`${company}:${route}:all`)
                        || (direction ? routeCache.get(`${company}:${route}:${direction}`) : null)
                        || [];
                }
                static _dedupeArrivals(arrivals) {
                    const list = (arrivals || []).filter(a => a && (a.eta || a.mins >= 0));
                    list.sort((a, b) => {
                        const ta = (a.eta instanceof Date && !isNaN(a.eta)) ? a.eta.getTime() : (Number(a.mins) * 60000);
                        const tb = (b.eta instanceof Date && !isNaN(b.eta)) ? b.eta.getTime() : (Number(b.mins) * 60000);
                        return ta - tb;
                    });
                    const out = [];
                    const seen = new Set();
                    for (const a of list) {
                        const t = (a.eta instanceof Date && !isNaN(a.eta)) ? a.eta.getTime() : `m${a.mins}`;
                        const key = `${t}|${a.dest_tc || ''}`;
                        if (seen.has(key)) continue;
                        seen.add(key);
                        out.push(a);
                    }
                    return out;
                }
                static async getETA(watchItem) {
                    const { company, route, stopId, serviceType, direction } = watchItem;
                    if (company === 'KMB') {
                        const cached = this._cachedRouteStops('KMB', route, direction);
                        const types = new Set([String(serviceType || 1)]);
                        for (const s of cached) {
                            if (String(s.stopId) === String(stopId) && (!direction || s.direction === direction)) {
                                types.add(String(s.serviceType || 1));
                            }
                        }
                        const tasks = [...types].map(st => async () => {
                            const match = cached.find(s => String(s.stopId) === String(stopId) && String(s.serviceType || 1) === String(st) && (!direction || s.direction === direction));
                            const item = Object.assign({}, watchItem, { serviceType: st, seq: match ? match.seq : watchItem.seq });
                            const json = await Fetcher.fetchJSON(`${CONFIG.API.KMB}/eta/${stopId}/${route}/${st}`);
                            return this._parseETA(company, json, item);
                        });
                        const parts = await Utils.parallelLimit(tasks, 3);
                        const merged = [];
                        for (const part of parts) if (Array.isArray(part)) merged.push(...part);
                        return this._dedupeArrivals(merged).slice(0, CONFIG.UI.maxETAShow);
                    }
                    if (company === 'CTB') {
                        const json = await Fetcher.fetchJSON(`${CONFIG.API.CTB}/eta/CTB/${stopId}/${route}`);
                        return this._dedupeArrivals(this._parseETA(company, json, watchItem)).slice(0, CONFIG.UI.maxETAShow);
                    }
                    if (company === 'NLB') {
                        const cached = this._cachedRouteStops('NLB', route, direction);
                        let ids = [...new Set(
                            cached
                                .filter(s => String(s.stopId) === String(stopId) && (!direction || s.direction === direction))
                                .map(s => s.routeId)
                                .filter(Boolean)
                        )];
                        if (watchItem.routeId && !ids.some(id => String(id) === String(watchItem.routeId))) {
                            ids.unshift(watchItem.routeId);
                        }
                        if (ids.length === 0) {
                            if (cached.length > 0) {
                                const found = cached.find(s => String(s.stopId) === String(stopId));
                                if (found && found.routeId) watchItem.routeId = found.routeId;
                            }
                            if (!watchItem.routeId) {
                                const stops = await this.getStops('NLB', route);
                                const found = stops.find(s => String(s.stopId) === String(stopId));
                                if (found && found.routeId) watchItem.routeId = found.routeId;
                                else throw new Error('無法取得 NLB 路線 ID');
                            }
                            ids = [watchItem.routeId];
                        }
                        const tasks = ids.map(rid => async () => {
                            const json = await Fetcher.fetchJSON(`${CONFIG.API.NLB}/stop.php?action=estimatedArrivals&routeId=${rid}&stopId=${stopId}&language=zh`);
                            return this._parseETA(company, json, Object.assign({}, watchItem, { routeId: rid }));
                        });
                        const parts = await Utils.parallelLimit(tasks, 3);
                        const merged = [];
                        for (const part of parts) if (Array.isArray(part)) merged.push(...part);
                        return this._dedupeArrivals(merged).slice(0, CONFIG.UI.maxETAShow);
                    }
                    throw new Error('不支援的巴士公司');
                }
                static _parseETA(company, json, watchItem) {
                    const { direction, seq } = watchItem;
                    let arrivals = [];
                    if (company === 'KMB' || company === 'CTB') {
                        const data = json.data || [];
                        const wantDir = direction === 'outbound' ? 'O' : 'I';
                        let filtered = data.filter(item => {
                            const dirMatch = item.dir === wantDir;
                            const seqMatch = item.seq == seq;
                            return dirMatch && seqMatch;
                        });
                        if (filtered.length === 0) {
                            filtered = data.filter(item => item.dir === wantDir);
                        }
                        filtered = filtered.filter(item => item.eta);
                        filtered.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                        arrivals = filtered.map(item => {
                            const etaDate = new Date(item.eta);
                            const rawMins = Math.floor((etaDate - Date.now()) / 60000);
                            const mins = isNaN(rawMins) ? -1 : (rawMins < 0 ? 0 : rawMins);
                            return { eta: etaDate, mins, dest_tc: item.dest_tc || '目的地', remark: item.rmk_tc || item.remark_tc || '' };
                        });
                    } else if (company === 'NLB') {
                        const data = json.estimatedArrivals || [];
                        arrivals = data.map(item => {
                            let mins = parseInt(item.estimatedArrivalMinutes);
                            let etaTime = item.estimatedArrivalTime ? new Date(item.estimatedArrivalTime) : null;
                            if (isNaN(mins) || mins < 0) {
                                if (etaTime && !isNaN(etaTime)) { mins = Math.floor((etaTime - Date.now()) / 60000); if (mins < 0) mins = 0; } else mins = -1;
                            }
                            return {
                                eta: (etaTime && !isNaN(etaTime)) ? etaTime : null,
                                mins,
                                dest_tc: item.destinationName_tc || item.destinationName || item.destinationName_c || '目的地',
                                remark: item.rmk_tc || item.remark_tc || item.remark || ''
                            };
                        });
                    }
                    return arrivals;
                }

            }

            // ========== GPS 管理器（完整修复版） ==========
            class GPSManager {
                constructor() {
                    this.lat = null;
                    this.lng = null;
                    this.accuracy = null;
                    this.watchId = null;
                    this.statusCallback = null;
                    this._listeners = [];
                    this._isLocating = false;
                    this._lastError = null;
                }

                start(callback) {
                    this.statusCallback = callback;
                    if (!navigator.geolocation) {
                        this._updateStatus('⚠️ 此裝置不支援 GPS 定位', false);
                        return;
                    }
                    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                        this._updateStatus('⚠️ GPS 需在 HTTPS 安全連線下運作', false);
                        return;
                    }
                    // 使用 Permissions API 检查状态，避免强行弹窗
                    if (navigator.permissions && navigator.permissions.query) {
                        navigator.permissions.query({ name: 'geolocation' }).then((result) => {
                            if (result.state === 'granted') {
                                this._requestLocation(false);
                            } else if (result.state === 'prompt') {
                                this._updateStatus('📍 請點擊「定位」按鈕啟用 GPS', null);
                            } else {
                                this._updateStatus('⚠️ 定位權限已被拒絕，請至瀏覽器設定開啟', false);
                            }
                        }).catch(() => {
                            this._updateStatus('📍 點擊「定位」以啟用 GPS 服務', null);
                        });
                    } else {
                        this._updateStatus('📍 點擊「定位」以啟用 GPS 服務', null);
                    }
                }

                // 用户手势触发
                requestLocation() {
                    if (this._isLocating) return;
                    this._requestLocation(true);
                }

                _requestLocation(forcePrompt) {
                    this._isLocating = true;
                    this._updateStatus('⏳ 正在獲取精確位置...', null);

                    if (this.watchId) {
                        navigator.geolocation.clearWatch(this.watchId);
                        this.watchId = null;
                    }

                    const geoOptions = {
                        enableHighAccuracy: CONFIG.GPS.enableHighAccuracy,
                        timeout: CONFIG.GPS.timeout,
                        maximumAge: CONFIG.GPS.maximumAge
                    };

                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            this.lat = pos.coords.latitude;
                            this.lng = pos.coords.longitude;
                            this.accuracy = pos.coords.accuracy;
                            this._lastError = null;
                            this._isLocating = false;
                            this._updateStatus(`📡 定位成功 (精確度 ${Math.round(this.accuracy)}m)`, true);
                            this._notifyListeners();
                            this._startWatch();
                        },
                        (err) => {
                            this._isLocating = false;
                            this._lastError = err;
                            let msg = '⚠️ 定位失敗';
                            if (err.code === 1) {
                                msg = '⚠️ 定位權限被拒。請到手機「設定」>「瀏覽器」允許位置權限。';
                            } else if (err.code === 2) {
                                msg = '⚠️ 搜尋不到 GPS 訊號，請移步到接近窗邊或室外空間。';
                            } else if (err.code === 3) {
                                msg = '⏳ 定位逾時，手機 GPS 響應過慢，請再點擊一次。';
                            }
                            this._updateStatus(msg, false);
                        },
                        geoOptions
                    );
                }

                _startWatch() {
                    if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
                    this.watchId = navigator.geolocation.watchPosition(
                        (pos) => {
                            this.lat = pos.coords.latitude;
                            this.lng = pos.coords.longitude;
                            this.accuracy = pos.coords.accuracy;
                            this._updateStatus(`📡 實時定位中 (誤差 ${Math.round(this.accuracy)}m)`, true);
                            this._notifyListeners();
                        },
                        null,
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
                    );
                }

                stop() {
                    if (this.watchId) {
                        navigator.geolocation.clearWatch(this.watchId);
                        this.watchId = null;
                    }
                    this._isLocating = false;
                }

                _updateStatus(text, ok) {
                    if (this.statusCallback) {
                        let color = '#6c757d';
                        if (ok === true) color = '#2b8a3e';
                        else if (ok === false) color = '#c92a2a';
                        this.statusCallback(text, ok);
                    }
                }

                _notifyListeners() {
                    for (const fn of this._listeners)
                        try { fn(this.lat, this.lng); } catch (e) {}
                }

                onPositionUpdate(fn) {
                    this._listeners.push(fn);
                    if (this.lat !== null && this.lng !== null) fn(this.lat, this.lng);
                }

                getDistance(lat, lng) {
                    if (this.lat === null || this.lng === null) return Infinity;
                    return Utils.calcDistance(this.lat, this.lng, lat, lng);
                }

                isReady() {
                    return this.lat !== null && this.lng !== null;
                }

                getStatusText() {
                    if (this.lat !== null && this.lng !== null) return '已定位';
                    if (this._lastError && this._lastError.code === 1) return '權限被拒絕';
                    if (this._isLocating) return '定位中...';
                    return '未定位';
                }
            }

            // ========== 關注清單 ==========
            class WatchList {
                constructor() { this.items = []; this.load(); }
                load() {
                    const raw = localStorage.getItem('watchedBusRoutes');
                    if (raw) { try { this.items = JSON.parse(raw); } catch (e) { this.items = []; } } else { this.items = []; }
                    this.save();
                }
                save() { localStorage.setItem('watchedBusRoutes', JSON.stringify(this.items)); }
                add(item) {
                    const st = String(item.serviceType || 1);
                    const exists = this.items.some(b => b.company === item.company && b.route === item.route && b.stopId === item.stopId && b.direction === item.direction && String(b.serviceType || 1) === st);
                    if (exists) return false;
                    if (item.company === 'NLB' && !item.routeId) {
                        const cached = routeCache.get(`NLB:${item.route}:all`);
                        if (cached && cached.length > 0) {
                            const found = cached.find(s => s.stopId === item.stopId);
                            if (found && found.routeId) item.routeId = found.routeId;
                        }
                        if (!item.routeId) { throw new Error('NLB 路線缺少 routeId，請重新搜尋'); }
                    }
                    this.items.push(item);
                    this.save();
                    return true;
                }
                remove(index) { if (index >= 0 && index < this.items.length) { this.items.splice(index, 1); this.save(); return true; } return false; }
                clear() { this.items = []; this.save(); }
                sortBy(field) {
                    const order = (field === 'route') ? (a, b) => a.route.localeCompare(b.route) :
                        (field === 'eta') ? (a, b) => (a._etaMins || 999) - (b._etaMins || 999) :
                        (a, b) => (a[field] || '').localeCompare(b[field] || '');
                    this.items.sort(order);
                    this.save();
                }
                exportData() { return JSON.stringify(this.items, null, 2); }
                importData(json) {
                    try {
                        const data = JSON.parse(json);
                        if (!Array.isArray(data)) return false;
                        const allowed = new Set(['KMB', 'CTB', 'NLB']);
                        const clean = (v, max) => String(v ?? '').replace(/[<>]/g, '').trim().slice(0, max);
                        const cleaned = [];
                        for (const raw of data) {
                            if (!raw || typeof raw !== 'object') continue;
                            const company = String(raw.company || '').toUpperCase();
                            if (!allowed.has(company)) continue;
                            const route = clean(raw.route, 16);
                            const stopId = clean(raw.stopId, 64);
                            if (!route || !stopId) continue;
                            const serviceType = raw.serviceType || 1;
                            cleaned.push({
                                company,
                                route,
                                stopId,
                                stopName: clean(raw.stopName, 80) || '未知站',
                                direction: raw.direction === 'inbound' ? 'inbound' : 'outbound',
                                seq: Number.isFinite(Number(raw.seq)) ? Number(raw.seq) : 0,
                                serviceType,
                                lat: parseFloat(raw.lat) || 0,
                                lng: parseFloat(raw.lng) || 0,
                                routeId: raw.routeId || null
                            });
                        }
                        this.items = cleaned;
                        this.save();
                        return true;
                    } catch (e) { return false; }
                }
            }

                    });
                    this.fetchETA();
                    this._intervalId = setInterval(() => this.fetchETA(), CONFIG.UI.refreshInterval);
                    StopPlates.load().then(() => {
                        if (this.currentStops && this.currentStops.length) this._populateStationSelect(this.currentStops);
                        this.fetchETA();
                    });
                    // 預載九巴／城巴全站清單，令第一次搜尋唔使等逐站請求
                    KMBStops.load().catch(() => {});
                    CTBStops.load().catch(() => {});
                    NearbyIndex.loadNLB().catch(() => {});
                    this._initVoiceUi();
                    this._restoreTab();
                }

                _bindEvents() {
                    const searchHandler = Utils.debounce(() => this._onSearchInput(), CONFIG.UI.debounceDelay);
                    this.elements.companySelect.addEventListener('change', searchHandler);
                    this.elements.routeInput.addEventListener('input', searchHandler);
                    this.elements.routeInput.addEventListener('keydown', (e) => {
                        if (e.key !== 'Enter') return;
                        const raw = (this.elements.routeInput.value || '').trim();
                        if (NearbyIndex.looksLikePlace(raw)) {
                            e.preventDefault();
                            this._searchAddressFromRoute(raw);
                        }
                    });
                    this.elements.expandOut.addEventListener('click', () => this._expandDirection('outbound'));
                    this.elements.expandIn.addEventListener('click', () => this._expandDirection('inbound'));
                    this.elements.addBtn.addEventListener('click', () => this._addToWatchList());
                    this.elements.quickAddBtn.addEventListener('click', () => this._quickAddNearest());
                    this.elements.locateBtn.addEventListener('click', () => this._handleLocate());
                    this.elements.sortBtn.addEventListener('click', () => { this.watchList.sortBy('eta'); this.fetchETA(); this.showToast('已按最早到站排序'); });
                    this.elements.exportBtn.addEventListener('click', () => {
                        const data = this.watchList.exportData();
                        const blob = new Blob([data], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `bus_watchlist_${new Date().toISOString().slice(0,10)}.json`;
                        a.click();
                        URL.revokeObjectURL(url);
                        this.showToast('匯出成功');
                    });
                    this.elements.importBtn.addEventListener('click', () => {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = 'application/json';
                        input.onchange = (e) => {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                const result = this.watchList.importData(ev.target.result);
                                if (result) { this.fetchETA(); this.showToast('匯入成功'); } else this.showToast('匯入失敗，格式錯誤');
                            };
                            reader.readAsText(file);
                        };
                        input.click();
                    });
                    this.elements.clearBtn.addEventListener('click', () => {
                        if (confirm('確定要清空所有關注路線嗎？')) { this.watchList.clear(); this.fetchETA(); this.showToast('已清空'); }
                    });
                    this.elements.placeSearchBtn.addEventListener('click', () => this._searchExplore());
                    this.elements.placeInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            this._searchExplore();
                        }
                    });
                    this.elements.nearbyGpsBtn.addEventListener('click', () => this._searchNearbyByGps());
                    this.elements.nearbyResults.addEventListener('click', (e) => {
                        const chip = e.target.closest('.nearby-chip, .nearby-route-hit');
                        if (chip) {
                            this._addNearbyChip(chip);
                            return;
                        }
                        const hit = e.target.closest('.route-hit');
                        if (hit) this._openRouteFromHit(hit);
                    });
                    this.elements.tabRouteBtn.addEventListener('click', () => this._switchTab('route'));
                    this.elements.tabExploreBtn.addEventListener('click', () => this._switchTab('explore'));
                    this.elements.placeVoiceBtn.addEventListener('click', () => this._toggleVoice('explore'));
                    this.elements.voiceCancelBtn.addEventListener('click', () => this._stopVoice('已取消語音輸入'));
                    this.elements.stationSelect.addEventListener('change', () => this._updateAddButton());
                    this.elements.quickHint.addEventListener('click', (e) => {
                        if (e.target.classList.contains('hint-btn')) {
                            this._handleLocate();
                        } else if (!this.gps.isReady()) {
                            this._handleLocate();
                        }
                    });
                    this.elements.busList.addEventListener('click', (e) => {
                        const btn = e.target.closest('.del-btn');
                        if (!btn) return;
                        const key = btn.dataset.key;
                        if (!key) return;
                        const parts = key.split('|');
                        const company = parts[0], route = parts[1], stopId = parts[2], direction = parts[3];
                        const serviceType = parts[4] || '1';
                        const idx = this.watchList.items.findIndex(it =>
                            it.company === company &&
                            it.route === route &&
                            it.stopId === stopId &&
                            it.direction === direction &&
                            String(it.serviceType || 1) === String(serviceType)
                        );
                        if (idx !== -1) { this.watchList.remove(idx); this.fetchETA(); this.showToast('已移除'); }
                    });
                }

                _handleLocate() {
                    const btn = this.elements.locateBtn;
                    btn.disabled = true;
                    btn.classList.add('locating');
                    btn.textContent = '⏳ 定位中';
                    this._gpsSuspended = false;
                    this.gps.requestLocation();
                    setTimeout(() => {
                        btn.classList.remove('locating');
                        if (this.gps.isReady()) {
                            btn.textContent = '📡 已定位';
                            btn.style.background = '#2b8a3e';
                        } else {
                            btn.textContent = '📡 定位';
                            btn.style.background = '#e67700';
                        }
                        btn.disabled = false;
                        this._updateLocateButtonState();
                    }, 5000);
                }

                _updateLocateButtonState() {
                    const btn = this.elements.locateBtn;
                    if (this.gps.isReady()) {
                        btn.textContent = '📡 已定位';
                        btn.style.background = '#2b8a3e';
                        btn.disabled = false;
                        btn.classList.remove('locating');
                    } else {
                        btn.textContent = '📡 定位';
                        btn.style.background = '#e67700';
                        btn.disabled = false;
                        btn.classList.remove('locating');
                    }
                }

                _updateHint() {
                    const hint = this.elements.quickHint;
                    if (this.gps.isReady()) {
                        hint.textContent = '📍 GPS 已就緒，可使用「最近站」快速加入';
                        hint.className = 'quick-hint active';
                    } else {
                        const status = this.gps.getStatusText();
                        if (status === '權限被拒絕') {
                            hint.innerHTML = '⚠️ 定位權限被拒絕，請點擊 <button class="hint-btn">📡 定位</button> 並允許權限，或至瀏覽器設定開啟';
                            hint.className = 'quick-hint error';
                        } else if (status === '定位中...') {
                            hint.textContent = '⏳ 正在獲取位置，請稍候...';
                            hint.className = 'quick-hint';
                        } else {
                            hint.innerHTML = '📍 點擊 <button class="hint-btn">📡 定位</button> 啟用 GPS，以使用最近站功能';
                            hint.className = 'quick-hint';
                        }
                    }
                }

                _onSearchInput() {
                    const raw = (this.elements.routeInput.value || '').trim();
                    if (NearbyIndex.looksLikePlace(raw)) {
                        this._searchAddressFromRoute(raw);
                        return;
                    }
                    const route = raw.toUpperCase();
                    if (!route) { this._gpsSuspended = false; this.elements.stationSelect.innerHTML = '<option value="">-- 請輸入路線 --</option>'; this._updateAddButton(); this._updateQuickButtonState(); return; }
                    this._gpsSuspended = true;
                    this.elements.stationSelect.innerHTML = '<option value="">⏳ 搜尋中...</option>';
                    this._searchStations(route);
                }
                _searchAddressFromRoute(raw) {
                    this.elements.placeInput.value = raw;
                    this.elements.routeInput.value = '';
                    this._gpsSuspended = false;
                    this.elements.stationSelect.innerHTML = '<option value="">-- 請輸入路線搜尋 --</option>';
                    this._updateAddButton();
                    this._updateQuickButtonState();
                    this._switchTab('explore');
                    this._searchExplore();
                }
                _beginSearch() {
                    this._searchGen += 1;
                    if (this._searchAbort) this._searchAbort.abort();
                    this._searchAbort = new AbortController();
                    return { gen: this._searchGen, signal: this._searchAbort.signal };
                }
                _setSelectMessage(msg) {
                    const select = this.elements.stationSelect;
                    select.innerHTML = '';
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = msg;
                    select.appendChild(opt);
                }
                async _searchStations(route) {
                    const company = this.elements.companySelect.value;
                    const { gen, signal } = this._beginSearch();
                    try {
                        const stops = await BusAPI.getStops(company, route, null, signal);
                        if (gen !== this._searchGen) return;
                        this.currentStops = stops;
                        this._populateStationSelect(stops, null);
                    } catch (e) {
                        if (gen !== this._searchGen || (e && e.name === 'AbortError')) return;
                        console.error('搜尋失敗:', e);
                        this._setSelectMessage(`❌ 搜尋失敗: ${e.message||'請稍後重試'}`);
                        this._updateAddButton();
                        this._updateQuickButtonState();
                    }
                }

                _populateStationSelect(stops, directionFilter = null) {
                    const select = this.elements.stationSelect;
                    select.innerHTML = '';
                    if (!stops || stops.length === 0) {
                        select.innerHTML = '<option value="">⚠️ 此路線無車站</option>';
                        this._updateAddButton();
                        this._updateQuickButtonState();
                        return;
                    }

                    const { outbound, inbound } = Utils.foldStopsForDisplay(stops);

                    const getDist = (s) => this.gps.getDistance(s.lat, s.lng);

                    const addOption = (s, prefix = '', displaySeq = null) => {
                        const opt = document.createElement('option');
                        const dist = getDist(s);
                        const distText = isFinite(dist) ? `${Math.round(dist)}米` : '未知';
                        const seq = displaySeq !== null ? displaySeq : s.seq;
                        const plate = StopPlates.code(s.stopId);
                        const cleanName = Utils.stripPlateFromName(s.stopName, plate);
                        const special = (s.serviceType && String(s.serviceType) !== '1')
                            ? `（特別${s.serviceType}${s.variantOrig ? ' · ' + s.variantOrig : ''}）`
                            : '';
                        const plateText = (plate && !cleanName.includes(plate)) ? ` (${plate})` : '';
                        const label = `${prefix}第 ${seq} 站: ${cleanName}${plateText}${special} (${distText})`;
                        opt.textContent = label;
                        opt.value = JSON.stringify({
                            company: s.company,
                            route: s.route,
                            stopId: s.stopId,
                            stopName: s.stopName,
                            direction: s.direction,
                            seq: s.seq,
                            serviceType: s.serviceType || 1,
                            lat: s.lat,
                            lng: s.lng,
                            routeId: s.routeId || null
                        });
                        select.appendChild(opt);
                    };

                    const showOut = (directionFilter === null || directionFilter === 'outbound');
                    const showIn = (directionFilter === null || directionFilter === 'inbound');

                    if (showOut && outbound.length > 0) {
                        const hdr = document.createElement('option');
                        hdr.disabled = true;
                        hdr.style.fontWeight = 'bold';
                        hdr.textContent = '🟢 正向 (去程)';
                        select.appendChild(hdr);
                        let nearestDist = Infinity, nearestIdx = -1;
                        for (let i = 0; i < outbound.length; i++) {
                            const d = getDist(outbound[i]);
                            if (isFinite(d) && d < CONFIG.UI.nearestDistanceThreshold && d < nearestDist) {
                                nearestDist = d;
                                nearestIdx = i;
                            }
                        }
                        outbound.forEach((s, idx) => {
                            let prefix = '';
                            if (idx === nearestIdx && nearestIdx !== -1) prefix = '📍 [最近] ';
                            addOption(s, prefix, s.seq);
                        });
                        if (showIn && inbound.length > 0) {
                            const sep = document.createElement('option');
                            sep.disabled = true;
                            sep.textContent = '─────────────────';
                            select.appendChild(sep);
                        }
                    }

                    if (showIn && inbound.length > 0) {
                        const hdr = document.createElement('option');
                        hdr.disabled = true;
                        hdr.style.fontWeight = 'bold';
                        hdr.textContent = '🔵 反向 (回程)';
                        select.appendChild(hdr);
                        let nearestDist = Infinity, nearestIdx = -1;
                        for (let i = 0; i < inbound.length; i++) {
                            const d = getDist(inbound[i]);
                            if (isFinite(d) && d < CONFIG.UI.nearestDistanceThreshold && d < nearestDist) {
                                nearestDist = d;
                                nearestIdx = i;
                            }
                        }
                        inbound.forEach((s, idx) => {
                            let prefix = '';
                            if (idx === nearestIdx && nearestIdx !== -1) prefix = '📍 [最近] ';
                            addOption(s, prefix, s.seq);
                        });
                    }

                    if ((showOut && outbound.length === 0) && (showIn && inbound.length === 0)) {
                        select.innerHTML = '<option value="">⚠️ 無任何站點</option>';
                    }
                    this._updateAddButton();
                    this._updateQuickButtonState();
                }

                async _expandDirection(direction) {
                    const route = this.elements.routeInput.value.trim().toUpperCase();
                    if (!route) { this.showToast('請先輸入路線號碼'); return; }
                    const company = this.elements.companySelect.value;
                    this._gpsSuspended = true;
                    if (this.gps.watchId !== null) {
                        this.gps.stop();
                    }
                    const { gen, signal } = this._beginSearch();
                    try {
                        this._setSelectMessage(`⏳ 展開 ${direction==='outbound'?'正向':'反向'} 站...`);
                        const stops = await BusAPI.getStops(company, route, direction, signal);
                        if (gen !== this._searchGen) return;
                        this.currentStops = stops;
                        this._populateStationSelect(stops, direction);
                        this.showToast(`已展開 ${direction==='outbound'?'正向':'反向'} 站點`);
                    } catch (e) {
                        if (gen !== this._searchGen || (e && e.name === 'AbortError')) return;
                        this._setSelectMessage(`❌ 無法展開: ${e.message||'請重試'}`);
                        this._updateAddButton();
                        this._updateQuickButtonState();
                        this._gpsSuspended = false;
                    }
                }

                _addToWatchList() {
                    const select = this.elements.stationSelect;
                    const value = select.value;
                    if (!value) return;
                    try {
                        const item = JSON.parse(value);
                        if (!item.company || !item.route || !item.stopId) { this.showToast('資料不完整，請重新選擇'); return; }
                        if (this.watchList.add(item)) {
                            this.showToast(`已加入 ${item.route}  ${item.stopName}`);
                            this.elements.routeInput.value = '';
                            this.elements.stationSelect.innerHTML = '<option value="">-- 請輸入路線 --</option>';
                            this._updateAddButton();
                            this._updateQuickButtonState();
                            this.fetchETA();
                            this._gpsSuspended = false;
                        } else {
                            this.showToast('此車站已在清單中');
                            this._gpsSuspended = false;
                        }
                    } catch (e) { this.showToast('加入失敗: ' + e.message); }
                }

                _quickAddNearest() {
                    if (!this.gps.isReady()) {
                        this.showToast('請先點擊「定位」啟用 GPS');
                        this._handleLocate();
                        return;
                    }
                    const select = this.elements.stationSelect;
                    let nearestOption = null;
                    let minDist = Infinity;
                    for (let i = 0; i < select.options.length; i++) {
                        const opt = select.options[i];
                        const val = opt.value;
                        if (!val || val.startsWith('--') || val.includes('請輸入') || val.includes('無') || val.includes('找不到') || val.includes('失敗')) continue;
                        try {
                            const data = JSON.parse(val);
                            const dist = this.gps.getDistance(data.lat, data.lng);
                            if (isFinite(dist) && dist < CONFIG.UI.nearestDistanceThreshold && dist < minDist) {
                                minDist = dist;
                                nearestOption = opt;
                            }
                        } catch (e) {}
                    }
                    if (!nearestOption) {
                        this.showToast(`目前沒有 ${CONFIG.UI.nearestDistanceThreshold/1000} 公里內的站點`);
                        return;
                    }
                    const item = JSON.parse(nearestOption.value);
                    if (!item.company || !item.route || !item.stopId) { this.showToast('資料不完整'); return; }
                    if (this.watchList.add(item)) {
                        this.showToast(`快速加入 ${item.route}  ${item.stopName}`);
                        this.elements.routeInput.value = '';
                        this.elements.stationSelect.innerHTML = '<option value="">-- 請輸入路線 --</option>';
                        this._updateAddButton();
                        this._updateQuickButtonState();
                        this.fetchETA();
                        this._gpsSuspended = false;
                    } else {
                        this.showToast('此車站已在清單中');
                        this._gpsSuspended = false;
                    }
                }

                _updateAddButton() {
                    const select = this.elements.stationSelect;
                    const val = select.value;
                    const disabled = !val || val.startsWith('--') || val.includes('請輸入') || val.includes('無') || val.includes('找不到') || val.includes('失敗') || select.disabled;
                    this.elements.addBtn.disabled = disabled;
                    this.elements.addBtn.style.opacity = disabled ? '0.6' : '1';
                }

                _updateQuickButtonState() {
                    const select = this.elements.stationSelect;
                    let hasNearby = false;
                    if (!this.gps.isReady()) {
                        this.elements.quickAddBtn.disabled = true;
                        this.elements.quickAddBtn.title = '請先啟用 GPS 定位';
                        return;
                    }
                    for (let i = 0; i < select.options.length; i++) {
                        const opt = select.options[i];
                        const val = opt.value;
                        if (!val || val.startsWith('--') || val.includes('請輸入') || val.includes('無') || val.includes('找不到') || val.includes('失敗')) continue;
                        try {
                            const data = JSON.parse(val);
                            const dist = this.gps.getDistance(data.lat, data.lng);
                            if (isFinite(dist) && dist < CONFIG.UI.nearestDistanceThreshold) {
                                hasNearby = true;
                                break;
                            }
                        } catch (e) {}
                    }
                    this.elements.quickAddBtn.disabled = !hasNearby;
                    this.elements.quickAddBtn.title = hasNearby ? '加入最近站點' : '附近無站點';
                }

                _updateDistanceInSelect() {
                    const select = this.elements.stationSelect;
                    const options = select.options;
                    for (let i = 0; i < options.length; i++) {
                        const opt = options[i];
                        const val = opt.value;
                        if (!val || val.startsWith('--') || val.includes('請輸入') || val.includes('無') || val.includes('找不到') || val.includes('失敗')) continue;
                        try {
                            const data = JSON.parse(val);
                            const dist = this.gps.getDistance(data.lat, data.lng);
                            const distText = isFinite(dist) ? `${Math.round(dist)}米` : '未知';
                            const newLabel = opt.text.replace(/\s*\([^)]*\)\s*$/, `(${distText})`);
                            if (newLabel !== opt.text) opt.textContent = newLabel;
                        } catch (e) {}
                    }
                    this._updateQuickButtonState();
                }

                async fetchETA() {
                    if (this._isFetching) return;
                    this._isFetching = true;
                    const list = this.watchList.items;
                    const container = this.elements.busList;
                    try {
                        if (list.length === 0) {
                            container.innerHTML = '<div class="empty-message">清單空空如也，快加入路線吧！</div>';
                            this.elements.refreshTime.textContent = '🔄 無監控路線';
                            if (this._intervalId) { clearInterval(this._intervalId); this._intervalId = null; }
                            return;
                        }
                        if (!this._intervalId) {
                            this._intervalId = setInterval(() => this.fetchETA(), CONFIG.UI.refreshInterval);
                        }

                        const tasks = list.map((item, index) => async () => {
                            try {
                                const arrivals = await BusAPI.getETA(item);
                                return { index, arrivals, error: null };
                            } catch (err) {
                                return { index, arrivals: null, error: err };
                            }
                        });

                        const results = await Utils.parallelLimit(tasks, CONFIG.UI.maxConcurrentRequests);

                        const keyToItem = new Map();
                        for (let i = 0; i < list.length; i++) {
                            keyToItem.set(`${list[i].company}|${list[i].route}|${list[i].stopId}|${list[i].direction}|${list[i].serviceType || 1}`, { item: list[i], index: i });
                        }

                        const resultByIndex = new Map();
                        for (let r = 0; r < results.length; r++) resultByIndex.set(results[r].index, results[r]);

                        const fragment = document.createDocumentFragment();
                        for (let i = 0; i < list.length; i++) {
                            const item = list[i];
                            const result = resultByIndex.get(i) || { arrivals: [], error: null };
                            const arrivals = result.arrivals || [];
                            const error = result.error || null;
                            const dist = this.gps.getDistance(item.lat, item.lng);
                            const walkMins = isFinite(dist) ? Math.ceil(dist / CONFIG.UI.walkSpeedMpm) : null;
                            let etaMins = null, dest = '目的地', etaDisplay = '--', statusHtml = '', extraETAs = [];
                            if (arrivals && arrivals.length > 0) {
                                const first = arrivals[0];
                                etaMins = first.mins;
                                dest = first.dest_tc || '目的地';
                                etaDisplay = (etaMins === 0) ? '即將' : (etaMins > 0 ? `${etaMins}分` : '--');
                                extraETAs = arrivals.slice(1).map(a => a.mins >= 0 ? `${a.mins}分` : '--');
                                if (walkMins !== null && etaMins !== null && etaMins >= 0) {
                                    if (etaMins >= walkMins + 2) statusHtml = '<span class="status-badge status-ok">✅ 趕得切</span>';
                                    else if (etaMins >= walkMins) statusHtml = '<span class="status-badge status-rush">⚡ 時間緊迫</span>';
                                    else statusHtml = '<span class="status-badge status-late">❌ 趕唔切</span>';
                                } else {
                                    statusHtml = '<span class="status-badge" style="background:#6c757d;">⏳ 定位中</span>';
                                }
                                item._etaMins = etaMins;
                            } else {
                                if (error) {
                                    let errMsg = error.message || '未知錯誤';
                                    if (errMsg.includes('HTTP 404')) errMsg = '路線或車站不存在';
                                    else if (errMsg.includes('NetworkError')) errMsg = '網絡連線問題';
                                    else if (errMsg.includes('timeout')) errMsg = '請求逾時';
                                    etaDisplay = '⚠️';
                                    statusHtml = `<span class="status-badge" style="background:#c92a2a;">❌ ${Utils.escapeHtml(errMsg)}</span>`;
                                } else {
                                    etaDisplay = '--';
                                    statusHtml = '<span class="status-badge" style="background:#6c757d;">暫無</span>';
                                }
                                item._etaMins = 999;
                            }
                            const walkText = walkMins !== null ? `🚶 ${Math.round(dist)}m (約${walkMins}分)` : '🚶 定位中';
                            const company = Utils.escapeHtml(item.company);
                            const routeEsc = Utils.escapeHtml(item.route);
                            const destEsc = Utils.escapeHtml(dest);
                            const stopEsc = Utils.escapeHtml(StopPlates.label(item.stopName || '', item.stopId));
                            const remarkText = (arrivals && arrivals[0] && arrivals[0].remark) ? String(arrivals[0].remark).trim() : '';
                            const remarkHtml = remarkText ? `<div class="eta-remark">${Utils.escapeHtml(remarkText)}</div>` : '';
                            const badgeClass = `badge-${String(item.company || '').toLowerCase()}`;
                            const itemKey = `${item.company}|${item.route}|${item.stopId}|${item.direction}|${item.serviceType || 1}`;
                            const keyEsc = Utils.escapeHtml(itemKey);
                            const inlineStatusHtml = statusHtml.replace(/status-badge/g, 'status-inline').replace(/direction_badge/g, 'dir-badge');
                            let etaMultiHtml = `<span class="eta-min">${Utils.escapeHtml(etaDisplay)}</span>`;

                            `;
                            fragment.appendChild(div);
                        }

                        const newMap = new Map();
                        for (const newDiv of Array.from(fragment.children)) {
                            newMap.set(newDiv.dataset.key, newDiv);
                        }
                        const existing = Array.from(container.children);
                        const existingKeys = new Set();
                        for (const child of existing) {
                            const key = child.dataset.key;
                            if (!key || !newMap.has(key)) {
                                container.removeChild(child);
                            } else {
                                const newHtml = newMap.get(key).innerHTML;
                                if (child._lastHtml !== newHtml) {

                                }

                            }

                            return ia - ib;
                        });
                        const currentKeys = Array.from(container.children).map(c => c.dataset.key);
                        const sortedKeys = ordered.map(n => n.dataset.key);

                        if (!sameOrder) ordered.forEach(node => container.appendChild(node));

                    } finally {

                _gpsErrorMessage() {

                async _searchExplore() {

                        const isRouteNo = NearbyIndex.looksLikeRoute(raw);
                        let routes = isRouteNo ? await NearbyIndex.searchRoutes(raw) : [];
