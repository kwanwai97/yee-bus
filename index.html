                                if (e && e.name === 'AbortError') return;
                            });
                        } else {
                            this._setNearbyHint(destLabel
                                ? `已定位目的地「${destLabel}」，但附近${this._rangeHint()}內暫時搵唔到直達路線。`
                                : (routes.length || stops.length
                                    ? `搵到${routes.length ? ' ' + routes.length + ' 條相符路線' : ''}${stops.length ? '、' + stops.length + ' 個車站' : ''}。`
                                    : `搵唔到「${raw}」，可改試更完整嘅門牌或街道名稱。`),
                                destLabel || routes.length || stops.length ? (journeys.length ? 'ok' : (destLabel ? 'error' : 'ok')) : 'error');
                        }
                    } catch (e) {
                        if (e && e.name === 'AbortError') return;
                        this._setNearbyHint(e.message || '搜尋失敗', 'error');
                        this.showToast(e.message || '搜尋失敗');
                    } finally {
                        btn.disabled = false;
                        btn.textContent = old;
                    }
                }
                _closestStopOnRoute(stops, lat, lng, maxM) {
                    let best = null;
                    let bestDist = Infinity;
                    for (const s of stops || []) {
                        const dist = Utils.calcDistance(lat, lng, s.lat, s.lng);
                        if (!isFinite(dist) || dist > (maxM || 150)) continue;
                        if (dist < bestDist) {
                            best = s;
                            bestDist = dist;
                        }
                    }
                    return best;
                }
                async _confirmJourney(item, signal) {
                    const stops = await BusAPI.getStops(item.company, item.route, null, signal);
                    if (!stops || !stops.length || stops.error) return Object.assign({}, item, { unconfirmed: true });
                    const groups = new Map();
                    for (const s of stops) {
                        if (!s || s.error) continue;
                        const dir = s.direction === 'inbound' ? 'inbound' : 'outbound';
                        const st = String(s.serviceType || 1);
                        const key = `${dir}|${st}`;
                        if (!groups.has(key)) groups.set(key, []);
                        groups.get(key).push(s);
                    }
                    const radius = CONFIG.UI.nearbyRadiusM || 600;
                    let best = null;
                    for (const list of groups.values()) {
                        if (!list.length) continue;
                        let board = list.filter(s => String(s.stopId) === String(item.stopId)).sort((a, b) => a.seq - b.seq)[0];
                        let alight = list.filter(s => String(s.stopId) === String(item.destStopId)).sort((a, b) => a.seq - b.seq)[0];
                        if (!board) board = this._closestStopOnRoute(list, item.lat, item.lng, radius);
                        if (!alight) alight = this._closestStopOnRoute(list, item.destLat, item.destLng, radius);
                        if (!board || !alight) continue;
                        if (!(board.seq < alight.seq)) continue;
                        const boardDist = isFinite(item.dist) ? item.dist : Utils.calcDistance(item.lat, item.lng, board.lat, board.lng);
                        const alightDist = Utils.calcDistance(item.destLat, item.destLng, alight.lat, alight.lng);
                        const cand = Object.assign({}, item, {
                            direction: board.direction || list[0].direction,
                            serviceType: board.serviceType || list[0].serviceType || 1,
                            stopId: board.stopId,
                            stopName: board.stopName || item.stopName,
                            lat: board.lat || item.lat,
                            lng: board.lng || item.lng,
                            seq: board.seq,
                            destStopId: alight.stopId,
                            destStopName: alight.stopName || item.destStopName,
                            destLat: alight.lat || item.destLat,
                            destLng: alight.lng || item.destLng,
                            destSeq: alight.seq,
                            destDist: isFinite(alightDist) ? Math.round(alightDist) : item.destDist,
                            variantDest: board.variantDest || alight.variantDest || item.variantDest || '',
                            variantOrig: board.variantOrig || alight.variantOrig || item.variantOrig || '',
                            unconfirmed: false
                        });
                        if (!best) { best = cand; continue; }
                        const betterBoard = (boardDist || Infinity) < (best.dist || Infinity);
                        const betterAlight = !betterBoard && (cand.destDist || Infinity) < (best.destDist || Infinity);
                        const betterSpan = !betterBoard && !betterAlight && (alight.seq - board.seq) < (best.destSeq - best.seq);
                        if (betterBoard || betterAlight || betterSpan) best = cand;
                    }
                    return best || { invalid: true };
                }
                async _refineJourneys(items, signal, destLabel, extra) {
                    const cap = (items || []).slice(0, 20);
                    const tasks = cap.map(item => async () => {
                        try {
                            return await this._confirmJourney(item, signal);
                        } catch (e) {
                            if (e && e.name === 'AbortError') throw e;
                            return item;
                        }
                    });
                    const raw = await Utils.parallelLimit(tasks, CONFIG.UI.maxConcurrentRequests);
                    if (signal && signal.aborted) return;
                    const confirmed = [];
                    for (let i = 0; i < raw.length; i++) {
                        const row = raw[i];
                        if (!row || row.invalid) continue;
                        if (row.error) {
                            if (cap[i]) confirmed.push(Object.assign({}, cap[i], { unconfirmed: true }));
                            continue;
                        }
                        confirmed.push(row);
                    }
                    confirmed.sort((a, b) => a.dist - b.dist || String(a.route).localeCompare(String(b.route), 'zh-Hant', { numeric: true }));
                    this._renderExploreResults(Object.assign({}, extra || {}, { journeys: confirmed, destLabel }));
                    this._setNearbyHint(confirmed.length
                        ? `已定位目的地「${destLabel}」，附近行得到、可以去到嘅路線有 ${confirmed.length} 條，已按步行距離排序。撳線即可加入上車那站。`
                        : `已定位目的地「${destLabel}」，核對方向後暫時搵唔到直達路線。`,
                        confirmed.length ? 'ok' : 'error');
                }
                async _addNearbyChip(chip) {

                    if (!chip || chip.disabled) return;
                    const company = chip.dataset.company;
                    const route = chip.dataset.route;
                    const stopId = chip.dataset.stopId;
                    const stopName = chip.dataset.stopName || '';
                    const lat = parseFloat(chip.dataset.lat) || 0;
                    const lng = parseFloat(chip.dataset.lng) || 0;
                    const routeId = chip.dataset.routeId || null;
                    chip.disabled = true;
                    try {
                        const wantDir = chip.dataset.direction || null;
                        const stops = await BusAPI.getStops(company, route, wantDir || null);
                        let matches = (stops || []).filter(s => s && !s.error && String(s.stopId) === String(stopId));
                        if (wantDir) matches = matches.filter(s => s.direction === wantDir);
                        const picked = matches.length ? matches : [{
                            company, route, stopId, stopName, lat, lng,
                            direction: wantDir || 'outbound', seq: 0, serviceType: 1, routeId
                        }];
                        let added = 0, existed = 0;
                        for (const s of picked) {
                            const item = {
                                company: s.company || company,
                                route: s.route || route,
                                stopId: s.stopId,
                                stopName: s.stopName || stopName,
                                direction: s.direction || 'outbound',
                                seq: s.seq || 0,
                                serviceType: s.serviceType || 1,
                                lat: s.lat || lat,
                                lng: s.lng || lng,
                                routeId: s.routeId || routeId
                            };
                            if (this.watchList.add(item)) added += 1;
                            else existed += 1;
                        }
                        if (added) {
                            this.fetchETA();
                            this.showToast(added > 1 ? `已加入 ${company} ${route}（${added} 個方向）` : `已加入 ${company} ${route}`);
                        } else if (existed) {
                            this.showToast('呢條路線已經喺關注清單');
                            chip.disabled = false;
                        }
                    } catch (e) {
                        chip.disabled = false;
                        this.showToast(e.message || '加入失敗');
                    }
                }

                showToast(msg) {
                    const el = this.elements.toast;
                    el.textContent = msg;
                    el.classList.add('show');
                    clearTimeout(this._toastTimeout);
                    this._toastTimeout = setTimeout(() => { el.classList.remove('show'); }, 3000);
                }
            }

            document.addEventListener('DOMContentLoaded', () => { const app = new UIController(); window.__app = app; });
        })();
    </script>
</body>
